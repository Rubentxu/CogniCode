      async, no block_on in the domain) — FactStore::get first, entity hint
      refused when it contradicts the canonical subject, one atomic
      append_batch, store errors stay errors. WU5: EvidenceGrade lifted to the
      ungated domain::kernel_ids (e56 precedent), EvidenceLookup::resolve
      replaces bare existence, KernelEvidenceReadModel::load is the only I/O and
      records missing ids / dangling facts so FindingVerifier stays sync.
      WU6: coherence verification — evidence resolves, grade != Refutes, not
      dangling, fact snapshot == execution scope; each causal step must be
      grounded in BOTH evidence and fact, belong to the finding, and its
      evidence must grade exactly the claimed fact (SubjectMismatch when a

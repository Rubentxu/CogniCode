      (workspace, FactId) with no snapshot and EvidenceStore::add had no
      snapshot parameter, so evidence for snapshot B appeared in an A-pinned
      read whenever the same canonical FactId existed in both. Fixed: add/get
      pinned to (ws, snapshot) on both axes, FactStore::get added,
      KernelError::EvidenceIdCollision rejects an id re-use atomically,
      misleading doc corrected; characterization test written first).
      e62.2-lsi-analysis-scope archived (U42 part 1: AnalysisScope
      {workspace, snapshot} is part of a detector execution's identity —
      AnalysisInput.scope required by DetectorExecutor (MissingScope),
      captured on DetectorExecutionRef; EvidenceLookup declares the scope it
      was hydrated for and FindingVerifier checks finding.scope ==
      lookup.scope BEFORE resolving any id, so a finding produced in snapshot A
      cannot be verified against a read model from B even when every numeric id
      coincides; adversarial test with identical ids in two snapshots).
      e62.3-lsi-grounding-refs archived (U42 part 2a, WU0+WU1: the reviewer's
      two pre-conditions for the write bridge. WU0a: SnapshotId::NONE is the
      kernel's invalid sentinel and is now refused both at construction
      (AnalysisScope::try_new -> AnalysisScopeError::InvalidSnapshot,
      is_valid()) and at the trust boundary (DetectorExecutor::execute ->
      ExecutionError::InvalidScope, before planning and before any backend
      runs). WU0b: there was no evidence allocator at all — ids were
      hand-assigned in fixtures — so EvidenceStore::append_batch(ws, snap,
      Vec<NewEvidence>) now allocates ids from a per-(workspace, snapshot)
      sequence and commits allocate-all-then-commit-all, giving atomicity per
      execution (no orphaned evidence after a mid-batch failure) and no
      collision when two executions run in the same snapshot; explicit add()
      advances the allocator. WU1: GroundingRef {entity: Option<EntityId>,
      fact: FactId} added ADDITIVELY as Option on AstConstruct, GraphNode,
      GraphEdge and DataflowStatement (edges included because reachability is
      proved by traversing relations, not by the endpoints existing), with
      fact = authority / entity = hint expressed by entity_agrees_with; no
      backend reads it yet and no analysis behaviour changed).

key_evidence:
  - all_gh_releases_are_drafts: true
  - placeholder_digests: 15
  - default_profile_resolves_to_zero_components: true
  - include_kinds_is_inert: true
  - embedded_manifest_is_bundles_v0.95.0: true

decisions:
  dist:      KEEP_CUSTOM_RELEASE        # confirms existing ADR-052 (ACEPTADO); no new ADR
  mise:      primary_layer0_channel
  install_sh: primary
  aqua:      secondary
  homebrew:  secondary
  nix:       secondary
  asdf:      compatibility_only
  cargo_binstall: compatibility_only
  sdkman:    not_initially_justified
  proto:     not_initially_justified

contradicted_prior_claims:
  - cargo-binstall does not work from our tarballs as-is (needs [package.metadata.binstall] + crates.io publish)
  - SDKMAN is not JVM-only and can ship arbitrary multiplatform binaries (real blocker is vendor onboarding)

confirmations_of_prior_claims:
  - mise native github backend, no plugin, autodetect, checksums, mise.lock, attestations
  - mise aqua backend consumes aqua definitions
  - asdf 0.16 Go rewrite removed `global`/`local`/`update`
  - aqua generates definitions from a GitHub release; policy-as-code + cosign + SLSA + minisign + attestations

cross_cutting_finding: release publishes tarballs only; no SHA256SUMS and no attestations -> every channel's verification story is conditional on the e84 contract

additional_finding: scripts/check-release-matrix.sh enforces matrix<->Platform coherence but is never invoked by justfile or CI

unverified:
  - mise autodetection against our non-standard tokens without asset_pattern
  - cargo crate publish status
  - homebrew-core acceptance of a prebuilt-binary formula
  - asdf Windows support
  - dist build-feature parity / archive-name parity / byte-reproducibility

next: e85 (release factory / real artifact publishing) -- AWAITING REVIEW

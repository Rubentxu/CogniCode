<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>UAT — Modo guiado</title>
<style>:root {
  --bg: #0f1115;
  --card: #181b21;
  --text: #e6e6e6;
  --muted: #9aa0a6;
  --accent: #4da3ff;
  --ok: #4caf50;
  --warn: #ffb74d;
  --danger: #ef5350;
  --border: #23272e;
  --radius: 8px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
</style>
<style>* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); padding: 2rem; }
h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sub { color: var(--muted); font-size: .8rem; margin-bottom: 1rem; }

/* Status pills */
.status-pill { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.status-pill.pass { background: rgba(76,175,80,.15); color: var(--ok); }
.status-pill.fail { background: rgba(239,83,80,.15); color: var(--danger); }
.status-pill.blocked { background: rgba(255,183,77,.15); color: var(--warn); }
.status-pill.partial { background: rgba(77,163,255,.15); color: var(--accent); }
.status-pill.pending { background: rgba(154,160,166,.15); color: var(--muted); }

/* Scenario card (guided wizard) */
.scenario-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; max-width: 720px; margin: 0 auto; }
.step-title { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .5rem; }
.step-action { font-size: 1.1rem; margin: .5rem 0; display: flex; align-items: center; gap: .5rem; }
.step-expected { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
.step-expected strong { color: var(--text); }
.rationale { background: rgba(77,163,255,.08); border-left: 3px solid var(--accent); padding: .6rem .9rem; border-radius: 4px; font-size: .85rem; margin: 1rem 0; }
.evidence-drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 1rem; text-align: center; color: var(--muted); font-size: .85rem; margin: 1rem 0; }
.evidence-drop.dragging { border-color: var(--accent); color: var(--accent); }

/* Verdict buttons */
.verdict-row { display: flex; gap: .6rem; margin: 1rem 0; }
.btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: .6rem 1.1rem; border-radius: var(--radius); font-size: .9rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pass-btn:hover { border-color: var(--ok); color: var(--ok); }
.btn.fail-btn:hover { border-color: var(--danger); color: var(--danger); }
.btn.blocked-btn:hover { border-color: var(--warn); color: var(--warn); }
.btn.active-pass { background: rgba(76,175,80,.2); border-color: var(--ok); color: var(--ok); }
.btn.active-fail { background: rgba(239,83,80,.2); border-color: var(--danger); color: var(--danger); }
.btn.active-blocked { background: rgba(255,183,77,.2); border-color: var(--warn); color: var(--warn); }

/* Wizard navigation */
.wizard-nav { display: flex; justify-content: space-between; margin-top: 1.25rem; }
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 1rem 0; }
.progress-bar > div { height: 100%; background: var(--accent); transition: width .2s; }
.progress-label { font-size: .72rem; color: var(--muted); text-align: right; margin-top: .25rem; }

/* Tables (matrix + traceability) */
table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; font-size: .82rem; }
th, td { padding: .5rem .65rem; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: .7rem; letter-spacing: .05em; }
tr:last-child td { border-bottom: none; }

/* KPI row */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem; }
.kpi .v { font-size: 1.3rem; font-weight: 600; }
.kpi .l { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }

.copy-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 4px; padding: .1rem .45rem; font-size: .72rem; cursor: pointer; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

footer { margin-top: 2rem; color: var(--muted); font-size: .7rem; }
textarea { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: .5rem; font-family: inherit; font-size: .85rem; resize: vertical; }

/* Dark is the default theme (defined in tokens.css via :root). */</style>
</head>

</div>

<script>/* Storage helpers: localStorage persistence + export/import JSON (zero backend).
 *
 * The exported JSON is the canonical `UatSession` shape consumed by
 * `sddk uat ingest` (crates/sddk-cli/src/uat.rs):
 *   schema_version, session_id, plan_ref, release, executor, executed_by,
 *   started_at, finished_at, results: [{ scenario_id, status, comment,
 *   evidence: [{ kind, ref, note }], duration_minutes }].
 *
 * Keeping the localStorage shape and the export shape in sync is the whole
 * point of this module: a tester hits "Finalizar y exportar" and gets a file
 * that drops straight into the CLI.
 */

const UAT = (() => {
  const KEY = (release) => `sddk-${release}`;

  function nowRfc3339() {
    return new Date().toISOString();
  }

  function uuid() {
    // Cheap UUID v4-ish (crypto.randomUUID when available, fallback otherwise).
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return "uat-" + Math.random().toString(36).slice(2) + "-" + Date.now().toString(36);
  }

  function loadSession(release) {
    try {
      const raw = localStorage.getItem(KEY(release));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function saveSession(release, session) {
    try {
      localStorage.setItem(KEY(release), JSON.stringify(session));
      return true;
    } catch (e) { return false; }
  }

  // Legacy formats the wizard may have written before canonicalization.
  function fromLegacy(legacy, plan) {
    if (!legacy) return null;
    if (Array.isArray(legacy.results)) return legacy; // already canonical
    if (legacy.scenario_results && plan) {
      const order = [];
      for (const f of plan.features || []) {
        for (const s of f.scenarios || []) order.push(s.id);
      }
      const results = [];
      for (const id of order) {
        const r = legacy.scenario_results[id];
        if (!r || !r.status) continue;
        results.push({
          scenario_id: id,
          status: r.status,
          comment: r.comment || "",
          evidence: r.evidence || [],
          duration_minutes: r.duration_minutes || 0,
        });
      }
      return {
        schema_version: 1,
        session_id: legacy.session_id || uuid(),
        plan_ref: legacy.plan_ref || plan.release?.candidate || "",
        release: legacy.release || "",
        executor: legacy.executor || "human",
        executed_by: legacy.executed_by || "",
        started_at: legacy.started_at || nowRfc3339(),
        finished_at: legacy.finished_at || null,
        results,
      };
    }
    return null;
  }

  // Build the canonical `UatSession` from the wizard's internal verdicts.
  function buildUatSession({ release, planRef, executedBy, startedAt, verdicts, scenarioOrder, finishedAt }) {
    const results = [];
    for (const id of scenarioOrder) {
      const v = verdicts[id];
      if (!v || !v.status) continue;
      results.push({
        scenario_id: id,
        status: v.status,
        comment: v.comment || "",
        evidence: v.evidence || [],
        duration_minutes: v.duration_minutes || 0,
      });
    }
    return {
      schema_version: 1,
      session_id: uuid(),
      plan_ref: planRef || release,
      release,
      executor: "human",
      executed_by: executedBy || "tester",
      started_at: startedAt || nowRfc3339(),
      finished_at: finishedAt || nowRfc3339(),
      results,
    };
  }

  function downloadBlob(filename, json) {
    const blob = new Blob([JSON.stringify(json, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Finalize the wizard: compose canonical UatSession, persist, download.
  function finalizeAndExport({ release, planRef, executedBy, startedAt, verdicts, scenarioOrder }) {
    const session = buildUatSession({
      release, planRef, executedBy, startedAt, verdicts, scenarioOrder,
      finishedAt: nowRfc3339(),
    });
    saveSession(release, session);
    downloadBlob(`uat-session-${release}.json`, session);
    return session;
  }

  function exportSession(release) {
    const session = loadSession(release);
    if (!session) return null;
    downloadBlob(`uat-session-${release}.json`, session);
    return session;
  }

  function importSession(release) {
    return new Promise((resolve, reject) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json,.yaml,.yml";
      input.onchange = () => {
        const file = input.files && input.files[0];
        if (!file) { resolve(null); return; }
        file.text().then((text) => {
          try {
            const parsed = JSON.parse(text);
            saveSession(release, parsed);
            resolve(parsed);
          } catch (e) { reject(new Error("archivo no es JSON válido")); }
        });
      };
      input.click();
    });
  }

  function addEvidence(release, scenarioId, evidence) {
    const session = loadSession(release) || { release, results: [] };
    let entry = (session.results || []).find(r => r.scenario_id === scenarioId);
    if (!entry) {
      entry = { scenario_id: scenarioId, status: "PASS", evidence: [] };
      (session.results || (session.results = [])).push(entry);
    }
    if (!entry.evidence) entry.evidence = [];
    entry.evidence.push(evidence);
    saveSession(release, session);
  }

  function pasteScreenshot(release, scenarioId, callback) {
    document.addEventListener("paste", function handler(ev) {
      document.removeEventListener("paste", handler);
      const items = ev.clipboardData && ev.clipboardData.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = () => {
            addEvidence(release, scenarioId, {
              kind: "screenshot",
              ref: "sha256:clipboard-" + Date.now(),
              note: "pegado desde portapapeles",
            });
            callback(reader.result);
          };
          reader.readAsDataURL(blob);
          return;
        }
      }
    });
  }

  return {
    loadSession, saveSession, exportSession, importSession, addEvidence,
    pasteScreenshot, buildUatSession, fromLegacy, finalizeAndExport,
    nowRfc3339, uuid,
  };
})();</script>

const RELEASE = 'v1.0.0-current';
const all = [];
for (const f of PLAN.features || []) for (const s of f.scenarios || []) all.push({feature: f, scenario: s});
const SCENARIO_ORDER = all.map(({scenario}) => scenario.id);
let idx = 0;
let verdicts = {};
let startedAt = null;

function loadVerdicts() {
  const raw = UAT.loadSession(RELEASE);
  const plan = { release: { candidate: PLAN.release?.candidate || RELEASE } };
  const session = UAT.fromLegacy(raw, plan);
  if (!session) return;
  verdicts = {};
  for (const r of session.results || []) {
    verdicts[r.scenario_id] = {
      status: r.status,
      comment: r.comment || "",
      evidence: r.evidence || [],
      duration_minutes: r.duration_minutes || 0,
    };
  }
  startedAt = session.started_at || null;
  const testerEl = document.getElementById('tester-name');
  if (testerEl && session.executed_by && session.executed_by !== 'tester') testerEl.value = session.executed_by;
}
function saveVerdicts() {
  const tester = document.getElementById('tester-name').value.trim() || 'tester';
  const session = {
    schema_version: 1,
    session_id: UAT.uuid(),
    plan_ref: PLAN.release?.candidate || RELEASE,
    release: RELEASE,
    executor: 'human',
    executed_by: tester,
    started_at: startedAt || UAT.nowRfc3339(),
    finished_at: null,
    results: [],
  };
  for (const id of SCENARIO_ORDER) {
    const v = verdicts[id];
    if (!v || !v.status) continue;
    session.results.push({
      scenario_id: id,
      status: v.status,
      comment: v.comment || '',
      evidence: v.evidence || [],
      duration_minutes: v.duration_minutes || 0,
    });
  }
  UAT.saveSession(RELEASE, session);
}
function startIfNeeded() {
  if (!startedAt) {
    startedAt = UAT.nowRfc3339();
    saveVerdicts();
  }
}

function priorityBadge(p) {
  const txt = (p || "P2").toUpperCase();
  return `<span class="badge badge-${txt.toLowerCase()}">${txt}</span>`;
}
function assigneeBadge(a) {
  const txt = (a || "developer").toLowerCase();
  return `<span class="badge badge-assignee">${txt}</span>`;
}

function render() {
  const total = all.length;
  const { feature, scenario } = all[idx] || {};
  if (!feature) {
    document.getElementById('wizard').innerHTML =
      '<p class="page-sub">Plan vacío: no hay escenarios para ejecutar.</p>';
    updateProgress();
    return;
  }
  const steps = (scenario.plain_steps || []).map((step, i) => `
    <li style="--i:${i}">
      <div class="step-action">
        <span>${escapeHtml(step.action)}</span>
        ${step.copy_hint ? `<button class="copy-btn" data-copy="${escapeHtml(step.action)}">copiar</button>` : ""}
      </div>
      <div class="step-expected"><strong>Esperado</strong>${escapeHtml(step.expected)}</div>
    </li>
  `).join("");
  const current = verdicts[scenario.id] || {};
  const btn = (key, label, emoji, cls) => `
    <button class="verdict ${cls} ${current.status === key ? 'is-active' : ''}" data-verdict="${key}">
      <span class="v-emoji">${emoji}</span>
      <span class="v-label">${label}</span>
    </button>`;
  const evidenceChips = (current.evidence || []).map(e =>
    `<li class="evidence-chip">${escapeHtml(e.kind)}</li>`
  ).join("");
  const rationale = scenario.rationale
    ? `<p class="scenario-rationale" style="--i:0"><strong>Por qué importa.</strong>${escapeHtml(scenario.rationale)}</p>`
    : "";
  const flags = (scenario.flags || []).map(f =>
    `<span class="badge badge-flag">${escapeHtml(f)}</span>`
  ).join("");

  document.getElementById('wizard').innerHTML = `
    <header class="scenario-header">
      <div class="scenario-meta">
        <span class="scenario-id">${escapeHtml(scenario.id)}</span>
        <span class="scenario-feature">${escapeHtml(feature.id)} · ${escapeHtml(feature.name)}</span>
        ${priorityBadge(scenario.priority)}
        ${assigneeBadge(scenario.assignee)}
        ${flags}
      </div>
      <h2 class="scenario-title">${escapeHtml(scenario.title)}</h2>
    </header>

    ${rationale}

    <ol class="scenario-steps">${steps}</ol>

    <div class="evidence-section" style="--i:${steps.length}">
      <p class="evidence-prompt"><strong>Evidencia</strong>${escapeHtml(scenario.evidence_prompt || "Pega screenshot con Ctrl+V o arrastra una imagen")}</p>
      <div class="evidence-drop" id="drop">Pega screenshot aquí (Ctrl+V)</div>
      <ul class="evidence-list">${evidenceChips}</ul>
    </div>

    <div class="comment-section" style="--i:${steps.length + 1}">
      <textarea id="comment" rows="2" placeholder="Comentario (opcional)">${escapeHtml(current.comment || "")}</textarea>
    </div>

    <div class="verdict-section" style="--i:${steps.length + 2}">
      <span class="verdict-label">Verdict</span>
      <div class="verdict-row">
        ${btn('PASS', 'Pasó', '✓', 'verdict-pass')}
        ${btn('FAIL', 'Falló', '✕', 'verdict-fail')}
        ${btn('BLOCKED', 'Bloqueado', '⏸', 'verdict-blocked')}
      </div>
    </div>

    <nav class="wizard-nav">
      <span class="nav-position">Escenario ${idx + 1} de ${total}</span>
      <div style="display:flex;gap:var(--space-2)">
        <button class="btn" id="prev-btn" ${idx === 0 ? 'disabled' : ''}>← Anterior</button>
        <button class="btn" id="next-btn" ${idx === total - 1 ? 'disabled' : ''}>Siguiente →</button>
      </div>
    </nav>
  `;

  updateProgress();

  // Bind verdict buttons.
  document.getElementById('wizard').querySelectorAll('.verdict').forEach(b => {
    b.addEventListener('click', () => setVerdict(scenario.id, b.dataset.verdict, b));
  });

  // Bind copy buttons.
  document.querySelectorAll('.copy-btn[data-copy]').forEach(b => {
    b.addEventListener('click', () => {
      navigator.clipboard.writeText(b.dataset.copy).then(() => {
        b.textContent = 'copiado';
        b.classList.add('copied');
        setTimeout(() => { b.textContent = 'copiar'; b.classList.remove('copied'); }, 1400);
      });
    });
  });

  // Bind navigation.
  document.getElementById('prev-btn').addEventListener('click', () => nav(-1));
  document.getElementById('next-btn').addEventListener('click', () => nav(1));

  // Evidence paste handler.
  UAT.pasteScreenshot(RELEASE, scenario.id, () => {
    const drop = document.getElementById('drop');
    if (drop) {
      drop.textContent = '✅ Screenshot capturado';
      drop.classList.add('captured');
      setTimeout(() => drop.classList.remove('captured'), 600);
    }
    render();
  });
}

function updateProgress() {
  const total = all.length;
  const done = Object.keys(verdicts).filter(id => verdicts[id] && verdicts[id].status).length;
  const pct = total ? Math.round((100 * done) / total) : 0;
  document.getElementById('progress-fill').style.width = pct + "%";
  document.getElementById('progress-label').textContent = `${done} / ${total}`;
  document.getElementById('progress-summary').textContent = `Progreso: ${done} / ${total} escenarios`;
}

function setVerdict(id, status, btnEl) {
  startIfNeeded();
  const entry = verdicts[id] || {};
  entry.status = status;
  const ta = document.getElementById('comment');
  if (ta) entry.comment = ta.value;
  verdicts[id] = entry;
  saveVerdicts();
  // Re-trigger the pulse animation by removing and re-adding the class.
  if (btnEl) {
    btnEl.classList.remove('is-active');
    void btnEl.offsetWidth;
    btnEl.classList.add('is-active');
  }
  updateProgress();
}

function nav(delta) {
  const cur = all[idx].scenario;
  const entry = verdicts[cur.id] || {};
  const ta = document.getElementById('comment');
  if (ta) entry.comment = ta.value;
  verdicts[cur.id] = entry;
  saveVerdicts();
  idx = Math.max(0, Math.min(all.length - 1, idx + delta));
  render();
}

function finalizeReport() {
  startIfNeeded();
  const cur = all[idx].scenario;
  const entry = verdicts[cur.id] || {};
  const ta = document.getElementById('comment');
  if (ta) entry.comment = ta.value;
  verdicts[cur.id] = entry;
  saveVerdicts();

  const tester = document.getElementById('tester-name').value.trim();
  if (!tester) {
    alert("Por favor, indica tu nombre o alias arriba (campo 'Tester').");
    return;
  }
  const missing = SCENARIO_ORDER.filter(id => !verdicts[id] || !verdicts[id].status);
  if (missing.length > 0) {
    const proceed = confirm(
      `Faltan ${missing.length} escenario(s) sin valorar:\n  ${missing.join(", ")}\n\n` +
      `¿Finalizar igualmente? Quedarán como "no valorados".`
    );
    if (!proceed) return;
  }
  const session = UAT.finalizeAndExport({
    release: RELEASE,
    planRef: PLAN.release?.candidate || RELEASE,
    executedBy: tester,
    startedAt,
    verdicts,
    scenarioOrder: SCENARIO_ORDER,
  });
  const ok = Object.values(verdicts).filter(v => v.status === 'PASS').length;
  const fail = Object.values(verdicts).filter(v => v.status === 'FAIL').length;
  const block = Object.values(verdicts).filter(v => v.status === 'BLOCKED').length;
  alert(
    `Reporte finalizado y descargado:\n\n` +
    `  pass: ${ok} | fail: ${fail} | blocked: ${block}\n` +
    `  session_id: ${session.session_id}\n\n` +
    `Siguiente paso:\n` +
    `  sddk uat ingest --session uat-session-${RELEASE}.json\n` +
    `  sddk uat failures --release ${RELEASE}   # para que el agente estudie los fallos`
  );
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

loadVerdicts();
render();
</script>
</body>

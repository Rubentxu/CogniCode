[package]
name = "cognicode-mcp"
description = "CogniCode MCP Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"

[lib]
# M3.5: expose `auth::check_bearer_token` as a library surface so the
# constant-time comparison can be unit-tested without compiling the
# `cognicode-mcp-server` binary. Binaries below keep working unchanged;
# this is purely additive.
#
# This comment used to justify the same choice by claiming the server
# binary did not build on the current opentelemetry-prometheus. That claim
# was false: on f64f7195,
# `cargo build -p cognicode-mcp --bin cognicode-mcp-server` exits 0 in 1m05s
# from cold. The lib target stands on its own merit, which is why the
# rationale above needs no second justification.
name = "cognicode_mcp"
path = "src/lib.rs"

[[bin]]
name = "cognicode-mcp"
path = "src/main.rs"

[[bin]]
name = "cognicode-mcp-server"
path = "src/server.rs"

[[bin]]
name = "mcp-client"
path = "src/mcp_client.rs"

[features]
default = []
# `multimodal` is an opt-in feature that enables the multimodal MCP
# tools (`docs_ingest`, `graph_search`). Off by default.
multimodal = ["cognicode-core/multimodal"]

[dependencies]
cognicode-core = { workspace = true }
cognicode-runtime = { path = "../cognicode-runtime" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp.workspace = true
process-wrap.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
# Direct dep on the `prometheus` crate so the server binary can build a
# `prometheus::Registry` and call `TextEncoder::encode` on it. The
# 0.27 OTel→Prom exporter removed the old `Prometheus::default().export()`
# shortcut — we now use the 0.27 pattern of `Arc<Registry>` shared between
# the `PrometheusExporter` and the `/metrics` handler.
prometheus.workspace = true
clap.workspace = true
rayon.workspace = true
axum = { workspace = true }
tower = { workspace = true }
http = "1"
http-body-util = "0.1"
tokio-util = "0.7"
# M3.5: constant-time comparison for Bearer-token auth middleware.
subtle.workspace = true

# H4.4: dev-deps for the continuation chain e2e harness.
sha2.workspace = true

[dev-dependencies]
# L1.3 compat tests (find_usages_compat_0_97): workspace tempdir para
# construir fixtures ad-hoc. tempfile ya está en el workspace root.
tempfile.workspace = true

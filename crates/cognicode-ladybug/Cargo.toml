[package]
name = "cognicode-ladybug"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["default-7ports"]
# passthrough features for cognicode-core
postgres = ["cognicode-core/postgres"]
multimodal = ["cognicode-core/multimodal"]
default-7ports = ["postgres"]
multimodal-9ports = ["postgres", "multimodal"]

[dependencies]
cognicode-core = { path = "../cognicode-core", features = ["postgres", "persistence"] }
lbug = "0.19"
async-trait = "0.1"
chrono = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sqlx = { version = "0.8", features = ["postgres"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
# `serial_test` forces lbug-on-tempdir tests to run sequentially —
# lbug 0.19 holds an mmap on the `.lbdb` file and races with
# sibling tests' cleanup if they touch the same path even with
# unique filenames per test (the buffer manager races on the
# temp directory's filesystem mtime). Defaulting to serial execution
# is the lowest-friction fix; per-test path uniqueness is kept as
# defence-in-depth in `make_test_store`.
serial_test = "3"

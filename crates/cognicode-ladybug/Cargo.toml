[package]
name = "cognicode-ladybug"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["default-7ports"]
# passthrough features for cognicode-core
multimodal = ["cognicode-core/multimodal"]
default-7ports = []
multimodal-9ports = ["multimodal"]

[dependencies]
cognicode-core = { path = "../cognicode-core", features = ["persistence"] }
lbug = "0.19"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
serial_test = "3"

[package]
name = "spike-ladybug"
version = "0.1.0"
edition = "2024"
publish = false
description = "E29 S1 spike — validates lbug 0.19.0 builds via prebuilt static lib"

[dependencies]
lbug = "0.19"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
csv = "1"
tempfile = "3"

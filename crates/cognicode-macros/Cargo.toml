[package]
name = "cognicode-macros"
description = "Procedural macros for CogniCode: newtype derive, aix_tool attribute and declare_rule"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
trybuild = "1"
serde = { version = "1", features = ["derive"] }

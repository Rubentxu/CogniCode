[package]
name = "cognicode-graph-wasm"
description = "WASM shim for cognicode-graph-algos — exposes pagerank, god_nodes, and community detection to the browser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/cognicode-graph-wasm"
keywords = ["wasm", "webassembly", "graph", "pagerank", "community-detection"]
categories = ["wasm", "algorithms"]
readme = "README.md"
exclude = ["/tests/"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
wasm-bindgen = "0.2.125"
wasm-bindgen-macro = "0.2.125"
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"
cognicode-graph-algos = { workspace = true, features = [] }

[dev-dependencies]
serde_json = { workspace = true }

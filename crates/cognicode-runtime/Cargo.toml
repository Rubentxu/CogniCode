[package]
name = "cognicode-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "explorer-api"
path = "src/bin/api.rs"

[[bin]]
name = "explorer-mcp"
path = "src/bin/mcp.rs"

[dependencies]
cognicode-core = { path = "../cognicode-core" }
cognicode-explorer = { path = "../cognicode-explorer", default-features = false }
cognicode-ladybug = { path = "../cognicode-ladybug", optional = true }
async-trait.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rmcp.workspace = true

[dev-dependencies]
trybuild = "1"

[features]
# v0.78.0: lbug 0.19 as the canonical store (E29 final cutover).
# The `postgres` feature remains available for backward compat
# (the legacy bootstrap path + `PostgresRepository`).
default = ["ladybug"]
postgres = ["cognicode-explorer/postgres"]
# Multimodal: enables OpenAPI/GraphQL/gRPC/tRPC ingestion (cycle e15.5)
multimodal = ["cognicode-explorer/multimodal"]
# Ownership: enables CODEOWNERS/git-blame ownership attribution
ownership = ["cognicode-explorer/ownership"]
# Ladybug: enables lbug 0.19 as the runtime's canonical graph store
# (E29 Phase 2 / e29-2-switch-default). The default is still
# `postgres` (a future PR will switch the default after all
# downstream code migrates from PG-specific types to the lbug
# equivalents). The runtime supports BOTH backends — pick the
# canonical one with `default-features = ["ladybug"]` or
# `default-features = ["postgres"]`.
ladybug = ["cognicode-ladybug", "cognicode-ladybug/multimodal-9ports"]

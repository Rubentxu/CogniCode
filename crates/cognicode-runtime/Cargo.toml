[package]
name = "cognicode-runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "explorer-api"
path = "src/bin/api.rs"

[[bin]]
name = "explorer-mcp"
path = "src/bin/mcp.rs"

[dependencies]
cognicode-core = { path = "../cognicode-core" }
cognicode-explorer = { path = "../cognicode-explorer", default-features = false }
cognicode-ladybug = { path = "../cognicode-ladybug", optional = true }
async-trait.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rmcp.workspace = true

[dev-dependencies]
trybuild = "1"

[features]
# v0.78.0: lbug 0.19 as the canonical store (E29 final cutover).
# PostgreSQL was removed entirely (e29-7); LadybugDB is the sole backend.
default = ["ladybug"]
# Multimodal: enables OpenAPI/GraphQL/gRPC/tRPC ingestion (cycle e15.5)
multimodal = ["cognicode-explorer/multimodal"]
# Ownership: enables CODEOWNERS/git-blame ownership attribution
ownership = ["cognicode-explorer/ownership"]
# Ladybug: enables lbug 0.19 as the runtime's canonical graph store.
ladybug = ["cognicode-ladybug", "cognicode-ladybug/multimodal-9ports"]

[package]
name = "cognicode-explorer"
description = "CogniCode Explorer — moldable code exploration API and MCP"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"

[lib]
name = "cognicode_explorer"
path = "src/lib.rs"

[features]
# LadybugDB is the sole persistence backend (e29-7 full postgres removal).
# The explorer uses the in-memory `GraphStore` by default; the runtime
# wires the lbug-backed ports.
default = []
# Exposes test-only accessors (e.g. `ExplorerMcpHandler::registry`)
# so integration tests outside the crate can drive the
# brain-session lifecycle.
test-utils = []
# `multimodal` is an opt-in feature that enables the Generic Graph
# Layer (new `NodeKind`/`EdgeKind` targets), the docs-source adapter
# (`SourceExtractor`, `DocsSourceAdapter`), and the multimodal MCP
# tools (`docs_ingest`, `graph_search`). Off by default.
multimodal = ["cognicode-core/multimodal"]
# `ownership` enables CODEOWNERS/git-blame ownership attribution.
ownership = ["cognicode-core/ownership", "cognicode-core/multimodal"]

[dependencies]
cognicode-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rmcp.workspace = true
chrono.workspace = true
regex.workspace = true
time.workspace = true
inventory = "0.3"
axum = "0.7"
tower = { workspace = true }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Snapshot rendering — mmdc subprocess management
tempfile.workspace = true
which.workspace = true
base64.workspace = true
# TOML parsing for C4 architecture inference (E6 ADR-039)
toml.workspace = true
# Glob pattern matching for boundary rule evaluation (E19)
glob.workspace = true
# YAML parsing for expected-architecture.yaml drift detection
serde_yaml.workspace = true
# `async-trait` is always needed — the facade traits use `#[async_trait]`.
# It is NOT optional because the proc macro must always be available.
async-trait.workspace = true
# `futures` provides `futures::executor::block_on` which is safe to call
# from within a Tokio runtime (unlike `tokio::runtime::Handle::current().block_on`).
futures = "0.3"

# OpenAPI 3.1 parser for cycle e15.5 (`cognicode_ingest_openapi`).
# Default-features=false keeps the dep tree lean (no YAML support;
# JSON-only is sufficient since production specs are typically JSON).
oas3.workspace = true

# Hex encoding for SHA256 spec hashes emitted by the edge-emitter
# adapter and surfaced by the ingest handlers.
hex.workspace = true
sha2.workspace = true

[[bin]]
name = "cognicode-control-plane"
path = "src/bin/control_plane.rs"

[dev-dependencies]
criterion.workspace = true
tokio-test.workspace = true
async-trait.workspace = true
tempfile = "3.27"
tower.workspace = true
uuid = { version = "1.11", features = ["v4"] }
regex = "1"
# E2.W2 integration tests spawn the control-plane router over a real
# TCP listener and call it via reqwest. `json` is required to parse
# the response body; default-features=false keeps the dep tree lean.
reqwest = { workspace = true }

# MEDIDO 2026-10-04: sin `harness = false`, Cargo compila el bench con el
# harness de `libtest` y `criterion_main!` no llega a ejecutarse nunca. El
# binario arranca, acepta `--output-format`, responde "0 tests, 0 benchmarks"
# y sale 0: un benchmark que parece correr y no mide nada. Es el mismo
# patron que la Lección 214 del JOURNAL —una comprobacion que lee la mitad de
# lo que ocurre— aplicado a un harness.
#
# Va AL FINAL del fichero y no pegado a `criterion` a proposito. Insertado en
# medio de `[dev-dependencies]`, TOML no distingue "siguiente clave" de
# "siguiente tabla": las siete dev-dependencies que venian despues
# (`tokio-test`, `async-trait`, `tempfile`, `tower`, `uuid`, `regex`,
# `reqwest`) dejaron de ser dev-dependencies y pasaron a ser claves
# desconocidas de este `[[bench]]`. Cargo no se queja: avisa, compila, y
# cualquier test de integracion del explorer que use `tempfile` o `reqwest`
# revienta por una linea movida en un manifiesto.
[[bench]]
name = "explorerql_benchmarks"
harness = false

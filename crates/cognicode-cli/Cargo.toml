[package]
name = "cognicode-cli"
description = "CogniCode CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
autobins = false

[lib]
# T1-5.5: `cognicode-cli` was historically a bin-only crate.
# Adding `[lib]` makes `src/lib.rs` (with `pub mod presenter`) the
# library target, which lets integration tests under
# `crates/cognicode-cli/tests/` import `cognicode_cli::presenter::*`
# to pin the byte stream and JSON shape.
name = "cognicode_cli"
path = "src/lib.rs"

[[bin]]
name = "cognicode"
path = "src/main.rs"

[[bin]]
name = "cogh"
path = "src/bin/cogh.rs"

[[bin]]
name = "cognicode-release"
path = "src/bin/release.rs"

[dependencies]
cognicode-core.workspace = true
cognicode-ladybug = { path = "../cognicode-ladybug", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
toml.workspace = true
sha2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
reqwest.workspace = true
tar.workspace = true
flate2.workspace = true
dirs = "5"
rayon.workspace = true

[features]
# E1.W3 — Surface `cognicode evidence list|search` over the LadybugDB
# evidence store. Optional because the Ladybug store pulls its own
# native deps (lbug 0.19); a slim CLI build can stay without it.
ladybug = [
    "cognicode-ladybug",
    "cognicode-ladybug/multimodal-9ports",
    "cognicode-core/evidence-cli-ladybug",
]
default = []

[dev-dependencies]
tempfile = "3"
serial_test = "3"
filetime = "0.2"
serde_json.workspace = true

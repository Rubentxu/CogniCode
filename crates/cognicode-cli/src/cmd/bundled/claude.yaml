apiVersion: cognicode/v1
kind: IdeAdapter
name: claude
description: "Claude Code IDE integration — writes ~/.claude/mcp/cognicode-mcp.json"
homepage: "https://github.com/Rubentxu/CogniCode/releases"

versions:
  # PRF-F1.W3 (H8): the artifact referenced in `url` is symbolic; the
  # actual installed content comes from the YAML body itself
  # (templates + integrate/uninstall rules below). The sha256 below is
  # the SHA-256 of this YAML file — it documents the integrity of the
  # template bundle rather than a separate tarball that does not exist.
  - ref: v0.1.0
    artifact: "claude-adapter-0.1.0.tar.gz"
    sha256: "35607b92c037e7527ddb7860f7929a1b6cc826e5a25d98d2a6e24d96e1a14b7b"
    url: "https://github.com/Rubentxu/CogniCode/releases/download/v0.1.0/claude-adapter-0.1.0.tar.gz"
    min_cogh: ">=0.1.0"

integrate:
  - id: skills
    kind: copy
    source: skills/
    target: ~/.claude/skills/cognicode-$VERSION/
  - id: mcp
    kind: write_json
    target: ~/.claude/mcp/cognicode-mcp.json
    template: |
      {
        "command": "$COGNICODE_HOME/shims/cognicode-mcp",
        "args": []
      }

uninstall:
  - id: skills
    kind: rm_rf
    target: ~/.claude/skills/cognicode-$VERSION/
  - id: mcp
    kind: remove_file
    target: ~/.claude/mcp/cognicode-mcp.json

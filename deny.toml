# cargo-deny configuration (PRF-CI-05).
# Policy: NEW vulnerabilities/unsound in advisories are ERRORS (deny).
#
# CORRECTED 2026-10-01. This header used to say that every ignore below had "a
# reason and a recorded fix path in docs/prf/specs/RECONCILIATION-MATRIX.md and
# JOURNAL §55". None of the five ids appeared in that matrix, which carries only
# a summary sentence claiming "5 deudas documentadas"; and JOURNAL §55 is about
# the A-013 lifecycle gate, not advisories. The backing record is
# docs/debts/DEBT-SEC-001-advisory-ignores.md, one row per ignore, enforced by
# crates/cognicode-cli/tests/advisory_ignore_backing_contract.rs.
#
# Each reason below was corrected on 2026-10-01 against what `cargo deny` and
# the advisory database actually report. Two of the old ones were wrong: this
# file claimed RUSTSEC-2024-0384 affects "instant < 0.1.13 ... fix: notify 8"
# when the tree carries instant 0.1.13 and the advisory's Solution line reads
# "No safe upgrade is available!", and it described RUSTSEC-2025-0141 as
# "bincode 1.x ... transitive" when bincode 2.0.1 is a DIRECT dependency of
# cognicode-core and is the crate the advisory names.
#
# RUSTSEC-2023-0057 (libc) was RETIRED on 2026-10-01: cargo deny reported
# advisory-not-detected, because libc 0.2.189 is past the affected range. It
# carried no risk. Recorded in the register rather than deleted silently.
#
# unused-ignored-advisory is "deny" so an ignore that no longer matches anything
# becomes an error instead of a warning. That is the failure mode that let a dead
# ignore sit here unnoticed.
[advisories]
version = 2
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    # unmaintained, no safe upgrade available (verified against the advisory
    # database 2026-10-01; crate and version measured from Cargo.lock):
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1; via mermaid-rs-renderer 0.2.2 -> fontdb 0.23.0
    "RUSTSEC-2025-0141", # bincode 2.0.1, DIRECT dep of cognicode-core; team ceased development
]
#
# RUSTSEC-2024-0384 (instant, unmaintained) was ALSO on this list and is now
# gone, and the removal was again forced by the gate rather than by good
# intentions. The register had recorded "No version bump fixes this on its own"
# next to "requires moving cognicode-core to notify 8", which reads as the bump
# being useless. Measured, it is the whole fix: notify 8.2.0 depends on
# notify-types ^2.0.0, and notify-types 2.0.0 depends on `web-time ^1.1.0` —
# the crate this advisory's author points at — with no `instant` anywhere in the
# tree. `cargo tree -i instant` answers "did not match any packages" after the
# bump, and `unused-ignored-advisory = "deny"` then reported
# error[advisory-not-detected] for the ignore, exactly as it did for protobuf
# below. The advisory is CLOSED, not suppressed: leaving it would suppress
# nothing while hiding that the tree moved.
#
# RUSTSEC-2024-0437 (protobuf 2.x stack overflow) is GONE from this list, and
# the removal was forced by the gate rather than by good intentions: with the
# OTel 0.27 -> 0.29 migration landed (prometheus 0.13 -> 0.14, protobuf
# 2.28.0 -> 3.7.2), `unused-ignored-advisory = "deny"` reported
# error[advisory-not-detected] for the ignore below, because no crate matched
# it any more. A live vulnerability ignore that has silently become a dead one
# is worse than no ignore at all: it suppresses nothing and hides the fact
# that the tree moved. See docs/debts/DEBT-SEC-001-advisory-ignores.md,
# "## Retired ignores".
#
# What the correction cost to learn, and what it bought:
#
#   opentelemetry-prometheus 0.28.0 -> prometheus ^0.13 + protobuf ^2.14  (no fix)
#   opentelemetry-prometheus 0.29.0 -> prometheus ^0.13 + protobuf ^2.14  (no fix)
#   opentelemetry-prometheus 0.29.1 -> prometheus ^0.14, no direct protobuf (fix)
#
# This list said 0.28 for months, which is why CR-07 stayed parked: bumping
# to 0.28 leaves protobuf on 2.x and looks like the fix. Only 0.29.1 works.
# Re-check with:
#   curl -s https://index.crates.io/op/en/opentelemetry-prometheus \
#     | grep -o '"vers":"0\.\(28\|29\)[^"]*"[^}]*'

# ----------------------------------------------------------------------------
# Licenses (Post-PRF addendum 2026-09-26)
#
# History: PRF-CI-05 (evidence/u55-ci05-advisories-sbom/OBSERVATIONS.md §4)
# declared "scan de LICENCIAS no exigido como gate (política de licencias
# pendiente de decisión)". Without an explicit [licenses] section,
# cargo-deny defaults to `allow = []` (deny all), so `cargo deny check
# licenses` returned FAILED on every dep — a silent failure that the
# observability gap made invisible.
#
# This section proposes a CONSERVATIVE allow-list covering the
# permissive licenses already in the dependency tree (verified 2026-09-26
# via `cargo deny check licenses`). It does NOT allow:
#   - GPL-2.0/3.0 (strong copyleft, requires legal review)
#   - AGPL-3.0 (network copyleft, almost always inappropriate)
#   - SSPL (source-available, not OSI-approved)
#   - Commons Clause (non-OSI commercial restriction)
#   - JSON License (deprecated, ambiguous)
#   - Beerware / Unlicense variants beyond The Unlicense
#
# LGPL-2.1-or-later is ALLOWED with a comment because it is in the
# current tree (transitive via some crates) and is acceptable for
# dynamic linking — but the operator should monitor this and replace
# the LGPL-licensed transitive if a permissively-licensed alternative
# appears.
#
# This section makes the licenses gate executable. It IS wired as its own
# blocking step in release.yml:135-138 (`cargo deny check licenses`). An earlier
# version of this comment claimed that release.yml and release-validate.yml
# "only run `cargo deny check advisories`, not licenses", which stopped being
# true when that step was added; corrected 2026-10-01.
#
# Status after this commit (2026-09-26):
#   - All third-party dependencies PASS the allow-list.
#   - Two workspace crates are flagged as unlicensed and need
#     operator decision: cognicode-runtime and cognicode-sandbox.
#     The 8 other workspace crates (cognicode, cognicode-core,
#     cognicode-cli, cognicode-mcp, cognicode-explorer,
#     cognicode-ladybug, cognicode-core-mock, cognicode-macros)
#     also lack a license field but cargo-deny does not flag them
#     because they are not encountered in the runtime dependency
#     graph (they are workspace-internal and consumed via path
#     deps). Adding license to those is a documentation-policy
#     question, not a license-compliance issue.
#   - Recommended operator action: pick a license (MIT, Apache-2.0,
#     MIT OR Apache-2.0, etc.) and add `license = "..."` to
#     cognicode-runtime/Cargo.toml and
#     cognicode-sandbox/Cargo.toml. Then re-run
#     `cargo deny check licenses` to confirm clean.
# ----------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",                      # Most common permissive license
    "Apache-2.0",               # Permissive + explicit patent grant
    "Apache-2.0 WITH LLVM-exception", # Apache-2.0 + linking exception (used by some compiler crates)
    "BSD-2-Clause",             # Simplified BSD
    "BSD-3-Clause",             # New/revised BSD
    "0BSD",                     # BSD Zero Clause (effectively public domain for code)
    "ISC",                      # Internet Systems Consortium license (permissive)
    "Zlib",                     # zlib permissive license (acknowledgement-based)
    "BSL-1.0",                  # Boost Software License (permissive)
    "CC0-1.0",                  # Creative Commons Zero (public domain dedication)
    "CDLA-Permissive-2.0",      # Community Data License Agreement Permissive (data use)
    "MIT-0",                    # MIT no attribution (public-domain equivalent)
    "MPL-2.0",                  # Mozilla Public License (file-level weak copyleft)
    "Unicode-3.0",              # Unicode license (data files, not source)
    "Unlicense",                # Public domain dedication
    # LGPL — allowed with caveat (see comment above). Only -2.1-or-later
    # is currently encountered in the dependency tree; -3.0-or-later is
    # listed preemptively in case a future dep ships under it.
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.8

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Shared by all test jobs
  TEST_DATABASE_URL: postgres://cognicode:cognicode@localhost:5432/cognicode
  DATABASE_URL: postgres://cognicode:cognicode@localhost:5432/cognicode

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognicode
          POSTGRES_PASSWORD: cognicode
          POSTGRES_DB: cognicode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          version: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Start postgres (services block handles this, but justfile dev-pg needs docker)
        run: docker compose -f docker-compose.yml up -d postgres

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U cognicode && break
            sleep 1
          done

      - name: Run unit tests
        run: cargo test --workspace --no-fail-fast

      - name: Run library tests only (skip integration tests that need full infra)
        run: cargo test --workspace --lib --no-fail-fast

  fmt-clippy:
    name: Format & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          version: stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ownership-feature:
    name: Ownership Feature Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cognicode
          POSTGRES_PASSWORD: cognicode
          POSTGRES_DB: cognicode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          version: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Start postgres
        run: docker compose -f docker-compose.yml up -d postgres

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U cognicode && break
            sleep 1
          done

      - name: Run tests with ownership feature
        run: cargo test --workspace --features ownership --no-fail-fast

      - name: Run clippy with ownership feature
        run: cargo clippy --workspace --features ownership --all-targets -- -D warnings

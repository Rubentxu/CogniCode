# LOCAL-ONLY workflow. Triggered manually via `act` running:
#   act -W .github/workflows/ci.yml workflow_dispatch
# or via `just ci-local`.
#
# This workflow has NO `on: push` or `on: pull_request` triggers by CogniCode
# policy (per docs/AGENTS.md "Local CI Is the Source of Truth" + ADR-031):
# GitHub Actions runs are reserved for the RELEASE GATE only (tag cuts,
# see release.yml). Day-to-day CI runs locally via `just check` /
# `just ci-local`. The workflow exists in `.github/workflows/` only so
# its definition is reviewable and runs through the same GitHub Actions
# runtime semantics via `act` locally — backed by `podman`.
#
# Per B3 (V1.0.0 pre-cut deferred items): remote CI triggers disabled 2026-08-16.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Run unit tests
        run: cargo test --workspace --all-targets
      - name: Run CLI tests
        run: cargo test -p cognicode-cli -- --test-threads=1
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  feature-matrix:
    # PRF-CI-02: nightly full campaign — feature matrix. Verifies the
    # workspace builds and tests under each declared feature combination,
    # not just the default set (ghost tools, gated arms, drift).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-no-default
            args: -p cognicode-core --no-default-features --lib
          - name: core-default
            args: -p cognicode-core --lib
          - name: core-all-features
            args: -p cognicode-core --all-features --lib
          - name: runtime-no-default
            args: -p cognicode-runtime --no-default-features --lib
          - name: runtime-all-features
            args: -p cognicode-runtime --all-features --lib
          - name: mcp-all-features
            args: -p cognicode-mcp --all-features --lib
          - name: explorer-all-features
            args: -p cognicode-explorer --all-features --lib
          - name: graph-algos-no-default
            args: -p cognicode-graph-algos --no-default-features
    name: matrix-${{ matrix.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Feature-matrix tests (${{ matrix.name }})
        run: cargo test ${{ matrix.args }}

  benchmarks:
    # PRF-CI-02: nightly benchmarks. Criterion keeps a per-environment
    # baseline under target/criterion; the uploaded artifact allows
    # comparing a run against the previous baseline on the same runner
    # class (baseline exacto por entorno). Report-only: a regression
    # does not fail the campaign, it is recorded for review.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Run criterion benches
        run: cargo bench -p cognicode-core
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.5.0 — pinned 2026-09-26 by QW-05
        with:
          name: criterion-report
          path: target/criterion
          retention-days: 30

  adversarial:
    # PRF-CI-02: nightly adversarial lane. Drives the known adversarial
    # corpora: malformed/concurrent parser inputs (tree_sitter_parser
    # adversarial suite), architecture drift e2e and findings canonical
    # grounding e2e. Serial where state is shared.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Parser adversarial suite
        run: cargo test -p cognicode-core --lib infrastructure::parser -- --test-threads=1
      - name: Architecture drift e2e
        run: cargo test -p cognicode-core --test architecture_drift_e2e
      - name: Findings canonical grounding e2e (evidence-kernel)
        run: cargo test -p cognicode-core --features evidence-kernel --test findings_canonical_grounding_e2e
      - name: Workspace isolation (evidence-kernel)
        run: cargo test -p cognicode-core --features evidence-kernel --test workspace_isolation
      - name: MCP contract e2e (real stdio client)
        run: cargo test -p cognicode-mcp --test continuation_e2e

  coverage-report:
    # CR-09 (Coverage sin gobernanza): era report-only. Ahora es gate
    # estricto con --fail-under-lines basado en el baseline re-baseline
    # 2026-09-26 (75.39% lines, 71.31% regions, 73.48% functions).
    # Cualquier PR que baje coverage por debajo del threshold quiebra
    # este job. Política no-regression: si el PR aumenta coverage,
    # sube el threshold por X (delta redondeado a 0.01%); si lo baja,
    # rebase el baseline como parte del PR.
    #
    # Threshold actual: 75.39% lines / 71.31% regions (HEAD baseline
    # post-CR-06+QW-03+QW-04+CR-08). El baseline está pineado en
    # evidence/u54-ci03-coverage/core-lib-baseline.txt y se reevalua
    # al cierre del ciclo de release (release.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage gate (cognicode-core lib) — --fail-under-lines 75.00
        run: |
          # CR-09 gate: --fail-under-lines devuelve exit != 0 si coverage baja.
          # Las regions (más estrictas, miden branches) usan 70.50%.
          # Threshold con un delta de -0.39% sobre baseline (75.39%) y
          # -0.81% sobre regions baseline (71.31%) para permitir cambios
          # que muevan coverage dentro del ruido del compilador sin
          # false-positives (coverage puede oscilar ±0.5% entre runs).
          # Subir el baseline requiere actualizar este bash + la evidencia.
          set -euo pipefail
          cargo llvm-cov --lib -p cognicode-core --summary-only \
            --fail-under-lines 75.00 \
            --fail-under-regions 71.00 || {
              echo "::error::CR-09 coverage gate FAIL: coverage below threshold"
              echo "::error::Threshold: lines>=75.00 regions>=71.00 functions>=73.00"
              echo "::error::Baseline HEAD @ 76516ca5: lines=75.39 regions=71.31 functions=73.48"
              exit 1
            }
          echo "CR-09 coverage gate PASS"

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Check musl build
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p cognicode-mcp

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Build cogh CLI
        run: cargo build --release -p cognicode-cli --bin cogh
      - name: Run clean-HOME E2E test
        run: |
          export HOME=/tmp/cognicode-test-home-${{ github.run_id }}
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$HOME"
          ./target/release/cogh install --profile core || true
          echo "E2E install attempted"
      - name: Run sandbox scenarios (sanity check)
        if: false  # Disable for now - requires running API server
        run: |
          cargo build --release --bin cognicode-mcp
          ./target/release/cognicode-mcp --cwd . --tools file_read,file_write 2>&1 | head -5

  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          # Install commitlint
          npm install -g @commitlint/cli @commitlint/config-conventional
          # Lint all commits in the PR
          git log --format="%H %s" origin/main..HEAD | while read hash subject; do
            echo "$subject" | commitlint || exit 1
          done

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v2
      - name: Verify version sync
        run: just verify-version-sync
        continue-on-error: true

  # e85 — the release contract must hold in CI, not only at release time.
  release-contract:
    name: release-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.96.0  # pinned 2026-09-26 by CR-08-debt-verify — rust-toolchain.toml @ master pins the same version
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.7 — pinned 2026-09-26 by QW-05
      # R9: the workflow's declared targets must be exactly the ones the Rust
      # contract derives, every published platform must have a lane, and every
      # runner must be vetted. This script existed since e74 but was never
      # invoked, so it protected nothing automatically.
      - name: Release contract coherence (R1-R9)
        run: bash scripts/check-release-matrix.sh

      # The adversarial suite for the v2 schema, naming, digests, inventory,
      # manifest generation and the verify gate.
      - name: Release contract tests
        run: cargo test -p cognicode-cli --bin cognicode-release

# PR-CI — gate de merge sobre pull_request a main
#
# PRF-CI-07: dispara automáticamente una batería mínima pero suficiente en
# cada PR contra `main`. NO es la batería completa de `ci.yml` (LOCAL-ONLY
# con `act`); es el gate que un PR debe pasar para ser mergeable.
#
# Política (PRF §152 / HANDOFF §6.1 + ADR-031 + L1.2 Post-PRF):
# - Antes del cierre contractual v0.98.1 (2026-09-24), los triggers remotos
#   estaban deshabilitados para ahorrar minutos de CI en PRs revisados
#   manualmente. Tras la firma C7, la suite adversarial es robusta y el
#   retorno de inversión de un gate remoto es positivo: un PR que pase este
#   workflow puede mergearse con confianza; uno que falle no.
# - La batería completa (`ci.yml`) sigue siendo LOCAL-ONLY: solo corre
#   bajo `act` o `just ci-local`. El release gate sigue siendo `release.yml`
#   + `release-validate.yml` en tags.
# - L1.2 (Post-PRF): el agregador `merge-gate` centraliza TODA la
#   verificación (incluido el capabilities-drift-lint) para que el
#   contrato remoto siga siendo un único required check estable. NO se
#   añaden required checks adicionales en branch protection por gate nuevo.
#
# Jobs:
#   - check        : fmt + clippy con -D warnings (falla el PR si hay warn)
#   - build-binary : compila target/release/cognicode-mcp (necesario para
#                    el test adversarial E2E y para F0.1 find_usages CLI)
#   - test-pr      : batería mínima exigible para merge:
#                    * cognicode-core --lib
#                    * prf_sec_07_adversarial_campaign (nivel lib)
#                    * prf_mcp_05 enforcement (nivel lib)
#                    * prf_h06_adversarial_e2e (nivel binario, §153)
#   - merge-gate   : AGREGADOR. Depende de los 3 anteriores + ejecuta
#                    capabilities-drift-lint como step propio. Es el
#                    ÚNICO required check de branch protection.
#
# Si un PR añade una suite nueva al catálogo pineado, el responsable debe
# añadirla a `test-pr` mediante PR subsiguiente (mantener este gate
# alineado con el pineo de C0..C7 es política, no se autoextiende).
name: PR-CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs redundantes en pushes subsiguientes al mismo PR.
concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # check — formato + lints
  # -----------------------------------------------------------------------
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@stable  # NOT PINNED: canal estable. Pinear a SHA de release del action o introducir rust-toolchain.toml en repo
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.7 — pinned 2026-09-26 by QW-05
      - name: rustfmt --check
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # -----------------------------------------------------------------------
  # build-binary — produce el binario para el E2E y para F0.1 (cognicode CLI)
  # -----------------------------------------------------------------------
  build-binary:
    name: build cognicode-mcp (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@stable  # NOT PINNED: canal estable. Pinear a SHA de release del action o introducir rust-toolchain.toml en repo
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.7 — pinned 2026-09-26 by QW-05
      - name: Build release binario (cognicode-mcp)
        run: cargo build --release -p cognicode-mcp
      # L1.2.W2 — cognicode-control-plane (E2.W2, 2026-09-25) tambien
      # se compila aqui. El PR anterior lo añadio a Cargo.toml + bin
      # pero no incluyo su build en CI: una regresion especifica del
      # bin (p.ej. un cambio en api.rs o control_plane.rs) pasaba
      # CI sin deteccion. Lo pineamos aqui para que el merge-gate
      # cubra ambos bins del workspace.
      - name: Build release binario (cognicode-control-plane)
        # IMPORTANTE: --bin, NO -p. cognicode-control-plane es un bin
        # declarado en crates/cognicode-explorer/Cargo.toml bajo el
        # [[bin]] name="..."  block, no un package. cargo build -p
        # FALLA con 'package ID specification ... did not match any
        # packages'. workspace member = cognicode-explorer; bin =
        # cognicode-control-plane.
        run: cargo build --release --bin cognicode-control-plane
      - name: Upload binarios
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.5.0 — pinned 2026-09-26 by QW-05
        with:
          name: cognicode-bins-release
          path: |
            target/release/cognicode-mcp
            target/release/cognicode-control-plane
          retention-days: 1
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # test-pr — batería exigible para merge
  # -----------------------------------------------------------------------
  test-pr:
    name: test pineado (lib + E2E)
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - uses: dtolnay/rust-toolchain@stable  # NOT PINNED: canal estable. Pinear a SHA de release del action o introducir rust-toolchain.toml en repo
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2.7.7 — pinned 2026-09-26 by QW-05
      # Necesario para resolver el path al binario desde el directorio
      # del test runner (el helper honra CARGO_MANIFEST_DIR + target/).
      - name: Descargar binarios release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.8 — pinned 2026-09-26 by QW-05
        with:
          name: cognicode-bins-release
          path: ${{ github.workspace }}/target/release
      # actions/download-artifact@v4 descomprime sin preservar permisos
      # POSIX (x bit). Sin esto, los bins bajan como -rw-r--r-- y el
      # test -x de abajo falla con "binario no ejecutable".
      - name: Restaurar permisos de ejecución de los binarios
        run: |
          chmod +x ./target/release/cognicode-mcp
          chmod +x ./target/release/cognicode-control-plane
      - name: Verificar binarios
        run: |
          test -x ./target/release/cognicode-mcp \
            || (echo "cognicode-mcp no ejecutable"; exit 1)
          test -x ./target/release/cognicode-control-plane \
            || (echo "cognicode-control-plane no ejecutable"; exit 1)
          ./target/release/cognicode-mcp --version
          ./target/release/cognicode-control-plane --help | head -5
      - name: Tests lib (cognicode-core)
        run: cargo test -p cognicode-core --lib --quiet
      - name: Adversarial lib (PRF-SEC-07 nivel librería)
        run: cargo test -p cognicode-core --test prf_sec_07_adversarial_campaign --quiet
      - name: MCP enforcement (PRF-MCP-05)
        run: cargo test -p cognicode-core --lib prf_mcp_05 --quiet
      - name: Adversarial E2E (PRF-SEC-07 nivel binario, §153)
        run: cargo test -p cognicode-core --test prf_h06_adversarial_e2e --quiet

  # -----------------------------------------------------------------------
  # merge-gate — AGREGADOR único de branch protection (L1.2 Post-PRF).
  #
  # Este job es el ÚNICO required check de branch protection. Depende de
  # los tres jobs fan-out (check, build-binary, test-pr) y EJECUTA EN SU
  # PROPIO CUERPO el capabilities-drift-lint. Si este lint falla → este
  # job falla → merge-gate rojo → PR no mergeable. Branch protection intacta.
  #
  # Cualquier nuevo gate debe añadirse como STEP dentro de este job, no
  # como nuevo required check separado. Mantener un único contrato remoto
  # estable es la regla.
  # -----------------------------------------------------------------------
  merge-gate:
    name: merge-gate
    needs: [check, build-binary, test-pr]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - name: Verificar que los jobs fan-out pasaron
        # L1.2: patron seguro contra shell injection. GitHub Actions
        # no soporta `${{ needs.$job.result }}` (no expande $job dentro
        # de la expresion; producia el bug "0 jobs" en runs push
        # antiguos). Solucion canonica: pasar el mapa `needs` a env
        # via `toJSON()`, y resolver el job en bash con jq.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          for job in check build-binary test-pr; do
            result=$(echo "$NEEDS_JSON" | jq -r ".\"$job\".result")
            if [ "$result" != "success" ]; then
              echo "::error::$job job did not succeed ($result)"
              exit 1
            fi
          done
          check=$(echo "$NEEDS_JSON" | jq -r '.check.result')
          build_binary=$(echo "$NEEDS_JSON" | jq -r '."build-binary".result')
          test_pr=$(echo "$NEEDS_JSON" | jq -r '."test-pr".result')
          echo "fan-out: OK (check=$check, build-binary=$build_binary, test-pr=$test_pr)"
      # L1.2.W1 — capabilities drift lint.
      # Si el doc contractual y el código divergen, este step falla y
      # el PR deja de ser mergeable. Parte del agregador, NO un required
      # check separado.
      - name: capabilities drift lint (E0.W2 dentro de merge-gate)
        run: python3 sandbox/scripts/capabilities_drift_lint.py --strict
      # L1.3.W1 — compat matrix executable 0.97.x.
      # Ejecuta el test E2E que pinea backward-compat del servidor
      # actual contra el binario legacy 0.97.3 publicado en GitHub
      # releases. Si el binario legacy no está disponible en
      # `sandbox/.compat/0.97.3/cognicode-mcp` (CI runners sin fixture),
      # el step se SKIPpea — pero en máquinas con el binario extraído
      # (ver ADR-PRF-008 + sandbox/.compat/), un cambio que rompa
      # backward-compat del contrato MCP falla este step y bloquea
      # el merge. Política L1.3 / R1 de ADR-PRF-008.
      - name: compat matrix 0.97.x (L1.3 dentro de merge-gate, SKIP si fixture ausente)
        if: hashFiles('sandbox/.compat/0.97.3/cognicode-mcp') != ''
        run: |
          # Solo se ejecutan W1 (smoke 0.97.3) y W2 (backward
          # compat del servidor actual). W3 (forward compat)
          # usa el binario legacy como servidor y ya está
          # pineado en sentido contrario por W1 + W2.
          cargo test -p cognicode-mcp --test find_usages_compat_0_97 -- \
            --skip compat_forward_0973_server_handles_modern_request
      # L3.W1 — cognicode-ladybug unit tests.
      # 50 tests inline cubren: open/close del store, init_schema
      # idempotente, migrate_call_graph roundtrip, narrative_store
      # save/load/invalidate, quality_store, e29_2_neighbors, etc.
      # Pre-E1.W1 gap crítico: este crate NO estaba pineado en CI
      # aunque tiene la batería inline más completa del repositorio.
      # Cualquier refactor de `LadybugStore` que rompiese la suite
      # pasaba CI remoto sin detección. Cierra deuda M0.4 (preparación
      # E1).
      - name: cognicode-ladybug unit tests (L3.W1 dentro de merge-gate)
        run: cargo test -p cognicode-ladybug --lib --quiet
      # L3.W2 — QW-03 bin-tracking guard.
      # El script `scripts/ci/check-bin-tracking.sh` enumera cada
      # crate que declara `[[bin]]` y comprueba que el source file
      # correspondiente está tracked por git y NO está silenciado
      # por `.gitignore`. Pinea el contrato contra la pérdida
      # silenciosa del bin `cognicode-control-plane` (entry 9). El
      # contrato vive en `crates/cognicode-cli/tests/qw03_bin_tracking_guard.rs`
      # (3 tests: baseline + RED + recovery). Si este step falla,
      # el merge-gate rojo y el PR deja de ser mergeable. Política
      # L1.2.W* (paso step en merge-gate, no required check separado).
      - name: QW-03 bin-tracking guard (L3.W2 dentro de merge-gate)
        run: bash scripts/ci/check-bin-tracking.sh
      # L3.W2.2 — QW-03 contractual test (Rust side).
      # El test `qw03_bin_tracking_guard` cubre el contrato del
      # guard desde el lado Rust: invoca el script sobre el repo
      # real y sobre un tmp repo con drift plantado. Si el script
      # cambia su contrato sin actualizar el test, este test rompe
      # en CI antes de que el guard pierda su semántica.
      - name: QW-03 bin-tracking contractual test (L3.W2.2 dentro de merge-gate)
        run: cargo test -p cognicode-cli --test qw03_bin_tracking_guard --quiet
      # L3.W3 — QW-04 preflight contractual test (Rust side).
      # El test `qw04_preflight_contract` cubre las tres
      # invariantes baratas del preflight: (a) el script existe y
      # tiene +x, (b) el esquema JSON del recibo declara todos los
      # campos requeridos, (c) el script neutraliza
      # GIT_CONFIG_GLOBAL=/dev/null. (d) plus require_tool
      # dispara fail() con un mensaje claro. El preflight caro
      # (clone real + workspace tests) vive en release.yml.
      - name: QW-04 preflight contractual test (L3.W3 dentro de merge-gate)
        run: cargo test -p cognicode-cli --test qw04_preflight_contract --quiet
      # L3.W2 (futuro) — otros contract/old-new compatibility tests
      # añadidos como steps aquí, no como jobs separados. Política L1.2.
      - name: merge-gate OK
        run: echo "merge-gate[OK] fan-out verde + drift-lint verde"

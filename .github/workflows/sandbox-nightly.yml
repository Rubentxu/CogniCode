name: Sandbox Nightly

# Per CogniCode E31-B5 user directive (2026-08-10): "usaremos los github
# actions en local, nos olvidamos del uso real que no sea local". This
# workflow is RETAINED as documentation/spec only. The remote schedule
# trigger is disabled so the workflow does NOT run on GitHub-hosted
# runners.
#
# CORRECTED 2026-10-01. The previous header claimed that "`act + podman`
# executes it locally via `just scorecard-nightly`". Measured: nothing
# executes this workflow. `just scorecard-nightly` runs Python scripts
# (sandbox/scripts/build_flaky_log.py and the G6 CV assertion) and never
# mentions this file; the `act` invocations in the justfile target
# `regression-check.yml` and `ci.yml`. So the "local execution" that
# justified keeping this file's steps alive was never wired.
#
# The file is kept because six sandbox container definitions cite its
# "Prepare host layout" step as the spec for the host bind-path bridge:
#   sandbox/containers/cognicode-{rust,python,js,ts,java,go}.container
#
# WHAT A MANUAL DISPATCH DOES TODAY: it fails. On 2026-10-01 both "Setup
# Podman" steps were replaced by run steps that exit 1 with the reason
# attached, for two independent reasons: the action repository they used is
# gone (HTTP 404, verified that day), and the lane recipes they would call do
# not resolve from the workspace root. This is deliberate. Deleting the steps
# instead would make the job report GREEN while running no lane at all,
# because every failure downstream is swallowed by `|| true` or
# `continue-on-error: true`. A red workflow that says why is worth more than a
# green one that lies. See SDDK WorkItem 016a4f03, decision 402f2771.
#
# The nightly cadence is executed locally via:
#   just scorecard-nightly                    # log + archive + G6 check
#   just scorecard-streak                     # 3-run counter
#
# Reference: docs/V1.0.0-PRE-CUT-CHECKLIST.md
on:
  # schedule:                                  # DISABLED — local-only per E31-B5
  #   - cron: '0 3 * * *'                      # 03:00 UTC daily
  workflow_dispatch:                           # manual only — for ARM runs
    inputs:
      lane:
        description: 'Lane to run'
        required: true
        default: 'smoke'
        type: choice
        options: ['smoke', 'probe', 'full']

env:
  CARGO_TERM_COLOR: always
  JUST_ARGS: '--unstable'

jobs:
  sandbox-smoke:
    name: Sandbox Smoke Lane
    runs-on: ubuntu-latest
    # ubuntu-latest puede no soportar rootless podman + systemd user units
    #continue-on-error: true   # descomentar cuando se confirme que falla en hosted
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - name: Prepare host layout (quadlet bind path bridge)
        # Containers bind-mount %h/Proyectos/rust/CogniCode/sandbox/repos (local layout).
        # On hosted runners the workspace lives elsewhere — symlink the expected path.
        run: |
          mkdir -p "$HOME/Proyectos/rust/CogniCode"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/Proyectos/rust/CogniCode"

      # 2026-10-01 — this step used to be `uses: rootful/setup-podman@v4`.
      # The action repository was deleted from GitHub (HTTP 404, re-verified
      # that day). It is deliberately NOT replaced by a fork: no auditable
      # maintainer of one exists, and the released namespace could be
      # re-registered by anyone, who would then get their code executed on the
      # next manual dispatch. See decision 402f2771 on SDDK WorkItem 016a4f03.
      #
      # This step FAILS ON PURPOSE. Deleting it would make the job report
      # GREEN without running anything: `just sandbox-pull`, `just
      # sandbox-setup` and `just sandbox-ci-smoke` are defined in
      # sandbox/justfile, which the root justfile does not import, so they do
      # not resolve from the workspace root where Actions runs them — and the
      # two that would break are swallowed by `|| true` and
      # `continue-on-error: true` respectively. A loud failure is the truthful
      # state; a green job is not.
      - name: Setup Podman (UNAVAILABLE — action repository deleted)
        run: |
          echo "::error::rootful/setup-podman was deleted from GitHub (HTTP 404, verified 2026-10-01) and has no audited replacement."
          echo "::error::The lanes are unreachable here anyway: sandbox-pull / sandbox-setup / sandbox-ci-smoke / sandbox-ci-probe live in sandbox/justfile, and the root justfile declares no 'mod sandbox'."
          echo "::error::Failing loudly on purpose — deleting this step would turn the job green without running any lane."
          exit 1

      - name: Pull images
        run: just sandbox-pull || true   # || true: digests pueden cambiar

      - name: Setup containers
        run: just sandbox-setup || true

      - name: Run smoke lane
        run: just sandbox-ci-smoke
        continue-on-error: true   # producto puede fallar; infra se verifica por exit code

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.5.0 — pinned 2026-09-26 by QW-05
        with:
          name: smoke-results
          path: sandbox/results/
          retention-days: 7

  sandbox-probe:
    name: Sandbox Probe Lane
    runs-on: ubuntu-latest
    needs: sandbox-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 — pinned 2026-09-26 by QW-05
      - name: Prepare host layout (quadlet bind path bridge)
        # Containers bind-mount %h/Proyectos/rust/CogniCode/sandbox/repos (local layout).
        # On hosted runners the workspace lives elsewhere — symlink the expected path.
        run: |
          mkdir -p "$HOME/Proyectos/rust/CogniCode"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/Proyectos/rust/CogniCode"

      # Same reasoning as the sandbox-smoke lane; see the full note there and
      # SDDK decision 402f2771 on WorkItem 016a4f03.
      - name: Setup Podman (UNAVAILABLE — action repository deleted)
        run: |
          echo "::error::rootful/setup-podman was deleted from GitHub (HTTP 404, verified 2026-10-01) and has no audited replacement."
          echo "::error::sandbox-ci-probe lives in sandbox/justfile and does not resolve from the workspace root either."
          echo "::error::Failing loudly on purpose — deleting this step would turn the job green without running any lane."
          exit 1

      - name: Run probe lane
        run: just sandbox-ci-probe
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.5.0 — pinned 2026-09-26 by QW-05
        with:
          name: probe-results
          path: sandbox/results/probe/
          retention-days: 7

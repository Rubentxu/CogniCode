name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build musl binary
        run: |
          cargo build --release \
            --target x86_64-unknown-linux-musl \
            -p cognicode-mcp \
            -p cognicode-runtime \
            --bin explorer-api

      - name: Create artifact
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/v}"
          tar -czf dist/cognicode-${VERSION}-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release/ \
            explorer-api cognicode-mcp cognicode-runtime
          # Also include the cogh CLI
          cargo build --release -p cognicode-cli --bin cogh
          tar -czf dist/cognicode-cli-${VERSION}-x86_64-unknown-linux-musl.tar.gz \
            -C target/release/ \
            cogh

      - name: Generate release notes
        id: release-notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          NOTES=$(bash scripts/generate-release-notes.sh "$PREV_TAG" "${{ github.ref_name }}")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          body: ${{ steps.release-notes.outputs.notes }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

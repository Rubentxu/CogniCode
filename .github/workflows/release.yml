name: Release

# e85 — Linux Tier-1 release factory.
#
# Producer contract (e84):
#   R1 derived artifact names      R2 one component per artifact
#   R3 no orphan payloads          R4 no phantom manifest entries
#   R5 computed digests only       R6 manifest generated from artifacts
#   R7 one profile encoding        R8 tag == v{workspace version}
#   R9 Platform <-> target token is total
#
# Everything mechanical is derived by `cognicode-release`; no step here types a
# platform token, an artifact name, or a digest.
#
# Tier 1 is Linux x86_64 and aarch64 GNU on NATIVE runners. The Platform variants
# and adapter seams for macOS, Windows and MUSL are preserved in the Rust
# contract, but they are not advertised as supported until they pass the same
# gates.
#
# Draft-first: a failed post-upload check leaves the release as a DRAFT.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.95.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------
  # 1. Native build lanes. Each produces one archive PER COMPONENT.
  # -------------------------------------------------------------------
  build:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust_target }}

      # PRF-CI-05: advisory scan is a BLOCKING release gate. Policy lives in
      # deny.toml; documented transitive debts are ignored there with reasons.
      - name: Advisories gate (cargo-deny)
        run: |
          cargo install cargo-deny --locked || true
          cargo deny check advisories

      # PRF-CI-05: SBOM (CycloneDX) per workspace crate, uploaded with the
      # lane payloads for provenance. The actual generation is delegated
      # to scripts/ci/build-sboms-for-lane.sh so the validate workflow
      # and release.yml produce an identical artifact set (per published
      # binary, named with the rust target triple, never the per-crate
      # default that conflates multiple bins).
      - name: SBOM (cargo-cyclonedx, per published binary, canonical layout)
        run: |
          set -euo pipefail
          bash scripts/ci/build-sboms-for-lane.sh "${{ matrix.rust_target }}"
          for comp in cogh cognicode cognicode-mcp; do
            expected="crates/${comp}-${{ matrix.rust_target }}.cdx.json"
            test -f "${expected}" || {
              echo "::error::missing canonical SBOM: ${expected}"
              exit 1
            }
            echo "OK ${expected} ($(wc -c < "${expected}") bytes)"
          done

      - name: Build the publishable binaries natively
        run: |
          set -euo pipefail
          # cogh consumes evidence-gated types, so the feature is on for the
          # whole cognicode-cli package.
          cargo build --release --target ${{ matrix.rust_target }} \
            -p cognicode-cli --bin cogh --bin cognicode \
            --features cognicode-core/evidence-kernel
          cargo build --release --target ${{ matrix.rust_target }} \
            -p cognicode-mcp --bin cognicode-mcp

      - name: Build the release tool
        run: cargo build --release --bin cognicode-release

      - name: Package one archive per component
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"
          fi
          RELEASE=target/release/cognicode-release
          mkdir -p dist
          # The published product surface is the contract's, not this script's.
          # `plan` prints the canonical filenames; strip the derived
          # `-{version}-{token}.tar.gz` suffix to recover the component name.
          for filename in $("$RELEASE" plan --platform ${{ matrix.platform }} --version "$VERSION"); do
            component="${filename%-$VERSION-*}"
            filename=$("$RELEASE" name --component "$component" \
                       --platform ${{ matrix.platform }} --version "$VERSION")
            stage=$(mktemp -d)
            mkdir -p "$stage/bin"
            # Archive layout is `bin/<component>`, which is what the installer's
            # shim stage expects.
            cp "target/${{ matrix.rust_target }}/release/$component" "$stage/bin/$component"
            tar -czf "dist/$filename" -C "$stage" bin
            echo "packaged $filename"
          done
          ls -la dist

      - name: Smoke the produced binaries on a clean HOME
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export COGNICODE_HOME="$HOME/.cognicode"
          RELEASE_DIR="target/${{ matrix.rust_target }}/release"
          "$RELEASE_DIR/cogh" --version
          "$RELEASE_DIR/cogh" --help | head -5
          "$RELEASE_DIR/cognicode" --version
          "$RELEASE_DIR/cognicode-mcp" --version

      - name: Verify the archives extract and run standalone
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p extracted
          for archive in dist/*.tar.gz; do
            tar -xzf "$archive" -C extracted
          done
          # No Rust toolchain and no repository files are required after extraction.
          test -x extracted/bin/cogh
          extracted/bin/cogh --version
          test -x extracted/bin/cognicode
          extracted/bin/cognicode --version

      - name: Upload lane artifacts
        uses: actions/upload-artifact@v4
        with:
          name: payloads-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            crates/cogh-${{ matrix.rust_target }}.cdx.json
            crates/cognicode-${{ matrix.rust_target }}.cdx.json
            crates/cognicode-mcp-${{ matrix.rust_target }}.cdx.json
          if-no-files-found: error

  # -------------------------------------------------------------------
  # 2. Assembly, verification, draft publication.
  # -------------------------------------------------------------------
  release:
    name: assemble-and-publish
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Collect every lane's payloads
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: payloads-*
          # merge-multiple: false (NOT true). With merge-multiple: true,
          # v4 strips the artifact-name prefix and dumps every file into
          # a single staging/ tree — last writer wins on collision and the
          # `payloads-<platform>/dist/<component>-...tar.gz` layout the
          # flatten script depends on is destroyed. Keeping merge off
          # preserves each lane as its own subdir under staging/, which is
          # exactly what `stage-platform-payloads.sh` expects. Fix for
          # CI run 35967155996 (`no payloads-* lane directories found`).
          merge-multiple: false

      - name: Stage declared skill bundle payloads (DEBT-2)
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; VERSION="${TAG#v}"
          fi
          # Portable skill bundles are platform-neutral tarballs of
          # skills/<id>/ (the same shape `just bundle-skills` produces).
          # The release contract declares the canonical surface
          # (SKILL_BUNDLES); staging every skills/ dir that matches a
          # published id keeps the no-orphans / no-phantom R3/R4 gates.
          while IFS= read -r id; do
            if [ ! -f "skills/$id/manifest.yaml" ]; then
              echo "::error::published skill bundle `$id` has no skills/$id/manifest.yaml"
              exit 1
            fi
            tar -czf "staging/${id}-${VERSION}.tar.gz" -C "skills/$id" .
            echo "staged ${id}-${VERSION}.tar.gz"
          done < <(./target/release/cognicode-release skills --published 2>/dev/null \
                   || python3 -c "import re,sys; src=open('crates/cognicode-cli/src/cmd/release_contract.rs').read(); ids=re.findall(r'SkillBundleSpec\s*\{\s*id:\s*\"([^\"]+)\",\s*profiles:[^\n]*\n\s*published:\s*true',src); print('\n'.join(ids))")
          ls -la staging

      - name: Flatten per-lane payload directories to the staging root
        run: |
          set -euo pipefail
          # The build lanes upload `dist/*.tar.gz` via upload-artifact@v4,
          # which preserves the `dist/` prefix. download-artifact@v4 with
          # merge-multiple does not flatten, leaving the payloads at
          # `staging/payloads-<platform>/dist/<component>-<ver>-<plat>.tar.gz`.
          # `cognicode-release generate` scans `staging/` flat (see
          # release_factory.rs: build_inventory uses `std::fs::read_dir(staging)`),
          # so without this step the generate fails with
          # "missing artifact cogh-..." for every platform (the exact
          # failure of run 35874781973).
          # The flatten script enforces the canonical payload set, rejects
          # duplicates, refuses unknown files at the staging root, and
          # fails loudly on missing components.
          bash scripts/ci/stage-platform-payloads.sh staging
          ls -la staging

      - name: Resolve version and tag
        id: v
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved tag=$TAG version=$VERSION"

      - name: Build the release tool
        run: cargo build --release --bin cognicode-release

      - name: Generate BundleManifest v2, ReleaseInventory and SHA256SUMS
        run: |
          set -euo pipefail
          ./target/release/cognicode-release generate \
            --staging staging \
            --out release \
            --version "${{ steps.v.outputs.version }}" \
            --tag "${{ steps.v.outputs.tag }}" \
            --source-commit "$GITHUB_SHA"

      - name: release-verify (LOCAL, before anything is public)
        run: |
          set -euo pipefail
          ./target/release/cognicode-release verify \
            --staging release \
            --version "${{ steps.v.outputs.version }}" \
            --tag "${{ steps.v.outputs.tag }}"

      - name: Verify the actual packaged CLI, MCP and portable skills before publication
        run: |
          set -euo pipefail
          bash scripts/ci/release-install-smoke.sh "${{ steps.v.outputs.version }}" release

      - name: Create the GitHub Release as a DRAFT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          NOTES=$(bash scripts/generate-release-notes.sh "" "$TAG" || echo "CogniCode $TAG")
          # The tag already exists (it triggered this run), so do NOT pass
          # --target: that flag is for creating a missing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; reusing it"
          else
            gh release create "$TAG" --draft --title "CogniCode $TAG" --notes "$NOTES"
          fi

      - name: Upload payload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.v.outputs.tag }}" release/*.tar.gz --clobber

      - name: Confirm the UPLOADED asset set matches the local payload set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          expected=$(cd release && ls *.tar.gz | sort)
          actual=$(gh release view "$TAG" --json assets -q '.assets[].name' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::uploaded asset set does not match the produced payload set"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "uploaded payload set confirmed ($(echo "$expected" | wc -l) artifacts)"

      - name: Upload generated manifests, inventory and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.v.outputs.tag }}" \
            release/bundle-*.yaml release/release-inventory-*.json release/SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/bundle-*.yaml
            release/release-inventory-*.json
            release/SHA256SUMS

      - name: Verify the attestations as a consumer would
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for f in release/*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh attestation verify release/SHA256SUMS --repo "$GITHUB_REPOSITORY"

      - name: Re-verify the release AFTER upload (draft-first safety net)
        run: |
          set -euo pipefail
          ./target/release/cognicode-release verify \
            --staging release \
            --version "${{ steps.v.outputs.version }}" \
            --tag "${{ steps.v.outputs.tag }}"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.v.outputs.tag }}" --draft=false

      - name: Verify the published release as an external consumer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          draft=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::release $TAG is still a draft"
            exit 1
          fi
          gh release view "$TAG" --json assets -q '.assets[].name' | sort
          # Re-download every asset and re-verify the sums from the published bytes.
          mkdir -p verify-dl && cd verify-dl
          gh release download "$TAG"
          sha256sum -c SHA256SUMS
          echo "published release verified from re-downloaded bytes"

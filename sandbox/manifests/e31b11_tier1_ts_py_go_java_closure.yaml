# E31-B11 Tier-1 ts + py + go + java closure for 16 rust-only tools
# Goal: add ts + py + go + java cells to 16 more rust-only tools, reaching 5/5.
# Pairs with E31-B10 (17 tools) and closes E31-B4 partial.
#
# Tools promoted (16): graph_god_nodes, graph_query_filtered, graph_reduced,
#   graph_search_idf, graph_suggest_questions, graph_surprising_connections,
#   iac_query, merge_graphs, nl_to_symbol, project_insights, project_overview,
#   retrieve_and_verify, review_pr, smart_search, solid_audit, validate_contract.
#
# Cells already present (rust Tier-1 from prior cycles, NOT modified here):
#   anyhow, clap, ripgrep, serde, tokio
#
# Per-tool scenarios: 4 langs × 1 scenario each = 4 scenarios
# Total: 16 tools × 4 langs = 64 scenarios.
#
# Reference: docs/TEST-PLAN.md §3.1 / T3. After B11, 55 tools reach 5/5
# (8 existing + 14 from B9 + 17 from B10 + 16 from B11). Closes E31-B4 partial
# completely: 47 → 0.

version: "1.0"
language: multi
tier: B
description: "E31-B11 batch — Tier-1 ts + py + go + java closure for 16 rust-only tools, reaching 5/5"

timeout_seconds: 900


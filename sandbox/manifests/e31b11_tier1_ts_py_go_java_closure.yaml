  java/spring-petclinic:
    repo_url: "https://github.com/spring-projects/spring-petclinic.git"
    pinned_sha: "edf4db28affcc4741c79850a3d95bc3f177b5ff9"

validation:
  failure_is_regression: true
  stages:
    - name: ts_compile
      commands: ["npx tsc --noEmit 2>&1 || true"]
      timeout_seconds: 120
    - name: py_compile
      commands: ["python -m py_compile -q src/ 2>&1 || true"]
      timeout_seconds: 60
    - name: go_compile
      commands: ["go build -count=1 ./... 2>&1 || true"]
      timeout_seconds: 120
    - name: java_compile
      commands: ["mvn -q -o compile 2>&1 || true"]
      timeout_seconds: 180


# E31-B10 Tier-1 ts + py + go + java closure for 17 rust-only tools
# Goal: add ts + py + go + java cells to 17 tools that only had rust Tier-1
# (from rust.yaml, clap_repos.yaml, etc.) but no other languages. After this
# batch, those 17 tools reach 5/5 Tier-1.
#
# Tools promoted (17): ask_about_code, check_architecture, codebase_map,
#   export_callflow, export_mermaid, find_pattern_by_intent, generate_contract,
#   get_hot_paths, get_symbol_code, get_type_references, go_to_definition,
#   graph_analyze, graph_checkpoint, graph_community_detail, graph_condensed,
#   graph_explain, graph_feedback_arcs.
#
# Cells already present (rust Tier-1 from prior cycles, NOT modified here):
#   anyhow, clap, ripgrep, serde, tokio
#
# Cells added by B10:
#   ts/commander, ts/zod, click, urllib3, requests, go/cobra, go/bubbletea,
#   go/lo, java/spring-petclinic
#
# Per-tool scenarios: 4 langs × 1 scenario each = 4 scenarios
# Total: 17 tools × 4 langs = 68 scenarios.
#
# Reference: docs/TEST-PLAN.md §3.1 / T3. After B10, 39 tools reach 5/5
# (8 existing + 14 from B9 + 17 from B10). Closes E31-B4 partial: 47 → 16.

version: "1.0"
language: multi
tier: B
description: "E31-B10 batch — Tier-1 ts + py + go + java closure for 17 rust-only tools, reaching 5/5"

timeout_seconds: 900


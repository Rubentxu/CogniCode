# E31-B9 Tier-1 rust + go + java closure for 14 partial tools
# Goal: add real rust Tier-1 + go + java cells to 14 tools that already have
# ts + py cells (from E31-B4-rollup, E31-B7, E31-B8) but lacked rust Tier-1
# provenance (only placeholder entries in coverage_fill.yaml with empty
# repo:). After this batch, those 14 tools reach 5/5 Tier-1.
#
# Tools promoted (14): build_lightweight_index, detect_god_functions,
#   get_implementors, get_imports, get_members, get_per_file_graph,
#   graph_all_paths, graph_communities, graph_insights, graph_pagerank,
#   graph_query, list_view_specs, read_view_spec, reparse_on_edit.
#
# Languages added per tool:
#   rust (Tier-1 repos): anyhow, clap, ripgrep, serde, tokio
#   go (Tier-1 repos): cobra, bubbletea, lo
#   java (Tier-1 repo): spring-petclinic
#
# Cells already present (from prior batches, NOT modified here):
#   ts/commander, ts/zod, click, urllib3, requests
#
# Per-tool scenarios: 3 langs × 1 scenario each (rust+go+java) = 3 scenarios
# Total: 14 tools × 3 langs = 42 scenarios.
#
# Real Tier-1 repo SHAs (verified in sandbox/repos/):
#   rust: anyhow=8ea1819c, clap=4684d7ab, ripgrep=4649aa97, serde=03eec42c, tokio=dd344a55
#   go: cobra=e94f6d0d, bubbletea=ffa05021, lo=35e49f2c
#   java: spring-petclinic=edf4db28
#
# Reference: docs/TEST-PLAN.md §3.1 / T3. After B9, 22 tools reach 5/5
# (8 existing + 14 from B9). Closes E31-B4 partial: 47 → 33.
#
# Note: this manifest mirrors the conventions of e31b4*.yaml, e31b7*.yaml,
# e31b8*.yaml. Pinned repos are not re-declared for those already present
# in earlier batches; this manifest adds them for the closure cells only.

version: "1.0"
language: multi
tier: B
description: "E31-B9 batch — Tier-1 rust + go + java closure for 14 partial tools (build_lightweight_index, detect_god_functions, get_implementors, get_imports, get_members, get_per_file_graph, graph_all_paths, graph_communities, graph_insights, graph_pagerank, graph_query, list_view_specs, read_view_spec, reparse_on_edit), reaching 5/5"

timeout_seconds: 900

# Per-repo metadata for reproducibility (only the langs/cells added by B9)
repos:
  anyhow:
    repo_url: "https://github.com/dtolnay/anyhow.git"
    pinned_sha: "8ea1819c4c7829d0eb09e54a52806f382b8d445b"
  clap:
    repo_url: "https://github.com/clap-rs/clap.git"
    pinned_sha: "4684d7abc545cef1d78708864cfe8c7668ed49c1"
  ripgrep:
    repo_url: "https://github.com/BurntSushi/ripgrep.git"
    pinned_sha: "4649aa9700619f94cf9c66876e9549d83420e16c"
  serde:
    repo_url: "https://github.com/serde-rs/serde.git"
    pinned_sha: "03eec42c3313b36da416be1486e9ecac345784d5"
  tokio:
    repo_url: "https://github.com/tokio-rs/tokio.git"
    pinned_sha: "dd344a550c2c6ddc500a2a8ad2eca8e097795252"
  go/cobra:
    repo_url: "https://github.com/spf13/cobra.git"
    pinned_sha: "e94f6d0dd9a5e5738dca6bce03c4b1207ffbc0ec"
  go/bubbletea:
    repo_url: "https://github.com/charmbracelet/bubbletea.git"
    pinned_sha: "ffa05021909e14c478cbe138ca78effbea04e4e0"
  go/lo:
    repo_url: "https://github.com/samber/lo.git"
    pinned_sha: "35e49f2c9607a7f7f6cde872a42d8718d9c3d053"
  java/spring-petclinic:
    repo_url: "https://github.com/spring-projects/spring-petclinic.git"
    pinned_sha: "edf4db28affcc4741c79850a3d95bc3f177b5ff9"

validation:
  failure_is_regression: true
  stages:
    - name: rust_compile
      commands: ["cargo check --quiet 2>&1 || true"]
      timeout_seconds: 120
    - name: go_compile
      commands: ["go build -count=1 ./... 2>&1 || true"]
      timeout_seconds: 120
    - name: java_compile
      commands: ["mvn -q -o compile 2>&1 || true"]
      timeout_seconds: 180

scenarios:
  # ═══ Tool 1: build_lightweight_index (rust + go + java cells) ═══════════════
  - name: realrepo_build_lightweight_index_tokio
    description: "build_lightweight_index on tokio — verifies rust Tier-1 lightweight indexing on the tokio runtime crate"
    tool: build_lightweight_index
    action: index
    repo: tokio
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: tokio/src

  - name: realrepo_build_lightweight_index_cobra
    description: "build_lightweight_index on go/cobra — verifies go lightweight indexing on a real CLI framework"
    tool: build_lightweight_index
    action: index
    repo: go/cobra
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: .

  - name: realrepo_build_lightweight_index_petclinic
    description: "build_lightweight_index on spring-petclinic — verifies java lightweight indexing"
    tool: build_lightweight_index
    action: index
    repo: java/spring-petclinic
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/main/java


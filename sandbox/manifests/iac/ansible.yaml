# IaC Manifest - Ansible playbook extraction
version: "2.0"
language: ansible
tier: A
description: "Test interpret_ansible handler - extract plays, tasks and handlers as graph nodes, and the modules and roles they use as relations"

timeout_seconds: 120

validation:
  failure_is_regression: true
  stages:
    - name: syntax
      commands: ["ansible-playbook --syntax-check site.yml 2>&1"]
      timeout_seconds: 30

scenarios:
  # ─── Ansible IaC Scenarios ───────────────────────────────────────────────────
  # NOTE: All ansible scenarios are marked expected_failure because:
  # 1. iac_query is a lookup tool (not discovery) — same issue as terraform
  # 2. The graph identifies an Ansible resource by the name of the symbol and
  #    the file that declares it, and the query tool asks for the canonical
  #    identity of the declaration: the two do not meet yet.
  #
  # The ids are named, so they can be told from the file alone, without
  # running the parser first:
  #     ansible:site.yml:play:Configure_infrastructure
  #
  # The terraform manifest (terraform.yaml) shows the working pattern with stable IDs.

  - name: ansible_iac_query_all
    description: "DISCOVERY: Query all Ansible resources — expected_failure (no discovery support)"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:site.yml:play:Configure_infrastructure"
    notes: "iac_query does not support discovery. The ids are named, so the scenario can name the resource it wants; what is missing is the discovery."

  - name: ansible_iac_query_plays
    description: "DISCOVERY: Query plays — expected_failure (no discovery support)"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:site.yml:play:Configure_infrastructure"
    notes: "Same gap as ansible_iac_query_all."

  - name: ansible_iac_query_tasks
    description: "DISCOVERY: Query tasks — expected_failure (no discovery support)"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:site.yml:task:Check_app_is_responding"
    notes: "Same gap as ansible_iac_query_all."

  - name: ansible_iac_query_roles
    description: "DISCOVERY: Query roles — expected_failure (roles are relations, not nodes)"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:role:nginx"
    notes: "A role is not declared in the playbook: it lives in another file. The play pulls it in with a 'dependency.imports' relation whose destination is unresolved, and no node is invented for it. There is nothing to query."

  - name: ansible_iac_query_inventory
    description: "DISCOVERY: Query inventory — expected_failure (inventory not extracted as nodes)"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:inventory"
    notes: "interpret_ansible does not extract inventory groups/hosts as graph nodes."

  - name: ansible_iac_query_with_calls
    description: "DISCOVERY: Query task-to-module calls — expected_failure"
    tool: iac_query
    action: query
    workspace: sandbox/fixtures/ansible-playbook
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      resource_id: "ansible:site.yml:task:Check_postgres_is_accepting_connections"
    metrics:
      correctness:
        type: structure_match
      latency:
        target_ms: 500
        max_ms: 2000
    notes: "iac_query supports 'depth' param for dependency traversal, but discovery is the gap."

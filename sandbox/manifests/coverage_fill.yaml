# Coverage fill — tools without scenarios (e30-corpus-expansion Batch B)
# Goal: ≥1 scenario per runtime tool (G2 denominator 68).
# Uses the serde Rust fixture (language default). Builds the graph first so
# graph_* tools have a session graph. Environment-dependent tools
# (LLM / PR / evidence store) are exercised with expected_fail — the G2 gate
# counts tool exercised, not pass.

version: "1.0"
language: rust
tier: A
description: "Coverage fill — 23 scenarios covering the 22 tools without scenarios"

timeout_seconds: 120

validation:
  failure_is_regression: false
  stages: []

scenarios:
  - name: fill_build_graph
    description: "Build the serde call graph (session prerequisite)"
    tool: build_graph
    action: build
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    ground_truth:
      symbols_min: 5

  - name: fill_go_to_definition
    description: "go_to_definition on serde symbol"
    tool: go_to_definition
    action: definition
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      file_path: serde/src/lib.rs
      line: 218
      column: 11

  - name: fill_hover
    description: "hover on serde symbol"
    tool: hover
    action: hover
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      file_path: serde/src/lib.rs
      line: 218
      column: 11

  - name: fill_get_imports
    description: "get_imports for a serde module"
    tool: get_imports
    action: find
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      file_path: serde/src/lib.rs

  - name: fill_get_members
    description: "get_members for a serde type (session-dependent — expected_fail acceptable)"
    tool: get_members
    action: find
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      class_name: Serializer

  - name: fill_get_implementors
    description: "get_implementors for a serde trait (session-dependent — expected_fail acceptable)"
    tool: get_implementors
    action: find
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      trait_name: Serialize

  - name: fill_graph_pagerank
    description: "graph_pagerank on built graph"
    tool: graph_pagerank
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      alpha: 0.85
      max_iterations: 100

  - name: fill_graph_all_paths
    description: "graph_all_paths between serde symbols"
    tool: graph_all_paths
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      from_symbol: Serialize
      to_symbol: Serializer
      max_hops: 5

  - name: fill_graph_condensed
    description: "graph_condensed SCC view"
    tool: graph_condensed
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass

  - name: fill_graph_query
    description: "graph_query moldql on built graph"
    tool: graph_query
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      question: "what symbols exist"

  - name: fill_detect_god_functions
    description: "detect_god_functions on serde"
    tool: detect_god_functions
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      min_lines: 100

  - name: fill_detect_long_parameter_lists
    description: "detect_long_parameter_lists on serde"
    tool: detect_long_parameter_lists
    action: analyze
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      max_params: 5

  - name: fill_list_view_specs
    description: "list_view_specs (may be empty — still exercises tool)"
    tool: list_view_specs
    action: list
    workspace: .
    scenario_class: read_only
    expected_outcome: pass

  - name: fill_read_view_spec
    description: "read_view_spec for a missing spec (expected_fail is fine)"
    tool: read_view_spec
    action: read
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      view_spec_id: "coverage-fill-probe"

  - name: fill_reparse_on_edit
    description: "reparse_on_edit after a no-op edit (preview)"
    tool: reparse_on_edit
    action: reparse
    workspace: .
    scenario_class: read_only
    preview_only: true
    expected_outcome: expected_fail
    arguments:
      file_paths: ["serde/src/lib.rs"]

  - name: fill_find_pattern_by_intent
    description: "find_pattern_by_intent (moldql intent lowering)"
    tool: find_pattern_by_intent
    action: find
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      intent: "find all callers of serialize"

  - name: fill_nl_to_symbol
    description: "nl_to_symbol (NLP resolution)"
    tool: nl_to_symbol
    action: find
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      query: "the serializer trait"

  - name: fill_generate_contract
    description: "generate_contract for a serde function (runs against real schema)"
    tool: generate_contract
    action: generate
    workspace: .
    scenario_class: analysis
    expected_outcome: expected_fail
    arguments:
      function_name: serialize
      file_path: serde/src/lib.rs

  - name: fill_validate_contract
    description: "validate_contract with a stub contract (real schema — honest expected_fail)"
    tool: validate_contract
    action: validate
    workspace: .
    scenario_class: analysis
    expected_outcome: expected_fail
    arguments:
      contract_id: "coverage-fill-probe"
      generated_code: "fn serialize() {}"

  - name: fill_ask_about_code
    description: "ask_about_code (LLM — expected_fail without model backend)"
    tool: ask_about_code
    action: ask
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      question: "What does Serialize do?"

  - name: fill_review_pr
    description: "review_pr (requires PR context — expected_fail)"
    tool: review_pr
    action: review
    workspace: .
    scenario_class: analysis
    expected_outcome: expected_fail
    arguments:
      pr_number: 0

  - name: fill_retrieve_and_verify
    description: "retrieve_and_verify (requires evidence store — expected_fail)"
    tool: retrieve_and_verify
    action: verify
    workspace: .
    scenario_class: analysis
    expected_outcome: expected_fail
    arguments:
      claim: "Serializer is a trait in serde"

  - name: fill_iac_query
    description: "iac_query (Terraform — expected_fail on non-IaC fixture)"
    tool: iac_query
    action: query
    workspace: .
    scenario_class: read_only
    expected_outcome: expected_fail
    arguments:
      query: "resources"

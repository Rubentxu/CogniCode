# Tier-1 H2 manifest — search correctness resolution.
#
# Identical structure to sandbox/manifests-tier1/tier1_pilot_5repo.yaml
# (the H1 manifest), with ONE change: each search scenario carries an
# explicit `max_results: 1000` argument.
#
# H1 diagnosis: tokio (50%) and clap (0%) failed because the MCP
# search_content default cap of 50 truncated the result set before
# the GT-exact files surfaced (H1.4 receipt). The propagation path
# manifest.arguments → MCP request → SearchContentInput → Service is
# clean; the manifest simply didn't pass max_results.
#
# H2 experiment: pass an explicit, bounded max_results per call.
# 1000 is sufficient for every Tier-1 search pattern at the pinned
# SHAs (worst case is tokio::main at 599 matches). This is NOT an
# unbounded search — it is a controlled override for the bounded
# Tier-1 corpus.
#
# The 50-result default is left unchanged in the product. Only this
# manifest sets the override.
version: "1.0"
language: rust
tier: 1
description: "Tier-1 H2 — search with explicit max_results per scenario"
timeout_seconds: 120

scenarios:
  # ─── serde (03eec42c) ────────────────────────────────────────────────────
  - name: tier1_serde_read_source
    description: "Read serde crate src/lib.rs"
    tool: read_file
    action: read
    repo: serde
    workspace: serde
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      exists: true

  - name: tier1_serde_search_deserialize
    description: "Search 'fn deserialize' in serde crate"
    tool: search_content
    action: search
    repo: serde
    workspace: serde
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: "fn deserialize"
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/macros.rs
        - path: src/private/de.rs

  # ─── ripgrep (4649aa9700) ────────────────────────────────────────────────
  - name: tier1_ripgrep_read_source
    description: "Read ripgrep cli crate src/lib.rs"
    tool: read_file
    action: read
    repo: ripgrep
    workspace: crates/cli
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      exists: true

  - name: tier1_ripgrep_search_regex_matcher
    description: "Search 'RegexMatcher' across ripgrep crates"
    tool: search_content
    action: search
    repo: ripgrep
    workspace: crates
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: "RegexMatcher"
      path: .
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: crates/pcre2/src/matcher.rs
        - path: crates/searcher/src/lib.rs

  # ─── anyhow (8ea1819c4c) ─────────────────────────────────────────────────
  - name: tier1_anyhow_read_source
    description: "Read anyhow src/lib.rs"
    tool: read_file
    action: read
    repo: anyhow
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      exists: true

  - name: tier1_anyhow_search_anyhow_macro
    description: "Search 'anyhow!' macro in anyhow src"
    tool: search_content
    action: search
    repo: anyhow
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: "anyhow!"
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/error.rs

  # ─── tokio (dd344a550c) ──────────────────────────────────────────────────
  - name: tier1_tokio_read_source
    description: "Read tokio crate src/lib.rs"
    tool: read_file
    action: read
    repo: tokio
    workspace: tokio
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      exists: true

  - name: tier1_tokio_search_tokio_main
    description: "Search 'tokio::main' in tokio crate"
    tool: search_content
    action: search
    repo: tokio
    workspace: tokio
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: "tokio::main"
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/runtime/mod.rs

  # ─── clap (4684d7abc5) ───────────────────────────────────────────────────
  - name: tier1_clap_read_source
    description: "Read clap_builder src/lib.rs"
    tool: read_file
    action: read
    repo: clap
    workspace: clap_builder
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      exists: true

  - name: tier1_clap_search_arg_action
    description: "Search 'ArgAction' in clap_builder src"
    tool: search_content
    action: search
    repo: clap
    workspace: clap_builder
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: "ArgAction"
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/builder/command.rs

        \ {\n///     #     bail!(\"no such file or directory\");\n///     # }\n///     #\n///     use anyhow::{Context, Result};\n///\n///     fn do_it() -> Result<()> {\n///         helper().context(HelperFailed)?;\n///         # const IGNORE: &str = stringify! {\n///         ...\n///         # };\n///         # unreachable!()\n///     }\n///\n///     fn main() {\n///         let err = do_it().unwrap_err();\n///         if let Some(e) = err.downcast_ref::<HelperFailed>() {\n///             // If helper failed, this downcast will succeed because\n///             // HelperFailed is the context that has been attached to\n///             // that error.\n///             # return;\n///         }\n///         # panic!(\"expected downcast to succeed\");\n///     }\n///     ```\npub trait Context<T, E>: context::private::Sealed {\n    /// Wrap the error value with additional context.\n    fn context<C>(self, context: C) -> Result<T, Error>\n    where\n        C: Display + Send + Sync + 'static;\n\
        \n    /// Wrap the error value with additional context that is evaluated lazily\n    /// only once an error does occur.\n    fn with_context<C, F>(self, f: F) -> Result<T, Error>\n    where\n        C: Display + Send + Sync + 'static,\n        F: FnOnce() -> C;\n}\n\n/// Equivalent to Ok::<_, anyhow::Error>(value).\n///\n/// This simplifies creation of an anyhow::Result in places where type inference\n/// cannot deduce the `E` type of the result &mdash; without needing to write\n/// `Ok::<_, anyhow::Error>(value)`.\n///\n/// One might think that `anyhow::Result::Ok(value)` would work in such cases\n/// but it does not.\n///\n/// ```console\n/// error[E0282]: type annotations needed for `std::result::Result<i32, E>`\n///   --> src/main.rs:11:13\n///    |\n/// 11 |     let _ = anyhow::Result::Ok(1);\n///    |         -   ^^^^^^^^^^^^^^^^^^ cannot infer type for type parameter `E` declared on the enum `Result`\n///    |         |\n///    |         consider giving this pattern the explicit\
        \ type `std::result::Result<i32, E>`, where the type parameter `E` is specified\n/// ```\n#[allow(non_snake_case)]\npub fn Ok<T>(t: T) -> Result<T> {\n    Result::Ok(t)\n}\n\n// Not public API. Referenced by macro-generated code.\n#[doc(hidden)]\npub mod __private {\n    use self::not::Bool;\n    use crate::Error;\n    use alloc::fmt;\n    use core::fmt::Arguments;\n\n    #[doc(hidden)]\n    pub use crate::ensure::{BothDebug, NotBothDebug};\n    #[doc(hidden)]\n    pub use alloc::format;\n    #[doc(hidden)]\n    pub use core::result::Result::Err;\n    #[doc(hidden)]\n    pub use core::{concat, format_args, stringify};\n\n    #[doc(hidden)]\n    pub mod kind {\n        #[doc(hidden)]\n        pub use crate::kind::{AdhocKind, TraitKind};\n\n        #[cfg(feature = \"std\")]\n        #[doc(hidden)]\n        pub use crate::kind::BoxedKind;\n    }\n\n    #[doc(hidden)]\n    #[inline]\n    #[cold]\n    pub fn format_err(args: Arguments) -> Error {\n        #[cfg(anyhow_no_fmt_arguments_as_str)]\n\
        \        let fmt_arguments_as_str = None::<&str>;\n        #[cfg(not(anyhow_no_fmt_arguments_as_str))]\n        let fmt_arguments_as_str = args.as_str();\n\n        if let Some(message) = fmt_arguments_as_str {\n            // anyhow!(\"literal\"), can downcast to &'static str\n            Error::msg(message)\n        } else {\n            // anyhow!(\"interpolate {var}\"), can downcast to String\n            Error::msg(fmt::format(args))\n        }\n    }\n\n    #[doc(hidden)]\n    #[inline]\n    #[cold]\n    #[must_use]\n    pub fn must_use(error: Error) -> Error {\n        error\n    }\n\n    #[doc(hidden)]\n    #[inline]\n    pub fn not(cond: impl Bool) -> bool {\n        cond.not()\n    }\n\n    mod not {\n        #[doc(hidden)]\n        pub trait Bool {\n            fn not(self) -> bool;\n        }\n\n        impl Bool for bool {\n            #[inline]\n            fn not(self) -> bool {\n                !self\n            }\n        }\n\n        impl Bool for &bool {\n  \
        \          #[inline]\n            fn not(self) -> bool {\n                !*self\n            }\n        }\n    }\n}\n"

# Tier-1 H4.3 read_source manifest — H4.3 reconstruction opt-in.
#
# Identical structure to tier1_h2_search.yaml but with two changes:
#   1) Each read_source scenario carries `read_source_full: true` so the
#      orchestrator will follow the continuation_token chain to reconstruct
#      the full file content and score against the reconstructed content
#      (with byte-exact SHA-256 + mutation detection).
#   2) The scenario format is the H1/H2 root-mapping format
#      `{ version, language, tier, scenarios: [...] }` (NOT a top-level
#      sequence — that was a pre-existing H4.0 bug).
#
# Scenarios 1-5: read_file with read_source_full: true (5 repos).
# Scenarios 6-10: search_content with max_results: 1000 (control).
#
# Pinned SHAs (unchanged from H2/H4.0):
#   - serde    @ 03eec42c3313b36da416be1486e9ecac345784d5
#   - ripgrep  @ 4b3f8b00c093788a787f73d5079d8b86c0d77e3c
#   - anyhow   @ 1.0.85
#   - tokio    @ 1.36.0
#   - clap     @ 4.5.4
#
# Schema (read-only scenarios — H4 contract preserved):
#   * `read_source_full: true` opts into the H4.3 reconstructor.
#   * `ground_truth.code` pins a specific line/col+content of the file
#     that MUST appear in the reconstructed content for G4 green.
version: "1.0"
language: rust
tier: A
timeout_seconds: 300

scenarios:
  # ─── serde (03eec42c) ────────────────────────────────────────────────────
  - name: tier1_serde_read_source
    description: "Read serde crate src/lib.rs (H4.3 full reconstruction)"
    tool: read_file
    read_source_full: true
    action: read
    repo: serde
    workspace: serde
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      code:
        file: sandbox/repos/serde/serde/src/lib.rs
        line: 1
        col: 1
        content: "//! # Serde"

  - name: tier1_serde_search_deserialize
    description: "Search 'fn deserialize' in serde crate"
    tool: search_content
    action: search
    repo: serde
    workspace: serde
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: fn deserialize
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/macros.rs
        - path: src/private/de.rs

  # ─── ripgrep ─────────────────────────────────────────────────────────────
  - name: tier1_ripgrep_read_source
    description: "Read ripgrep cli crate src/lib.rs (H4.3 full reconstruction)"
    tool: read_file
    read_source_full: true
    action: read
    repo: ripgrep
    workspace: crates/cli
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      code:
        file: sandbox/repos/ripgrep/crates/cli/src/lib.rs
        line: 1
        col: 1
        content: "/*!"

  - name: tier1_ripgrep_search_regex_matcher
    description: "Search 'RegexMatcher' across ripgrep crates"
    tool: search_content
    action: search
    repo: ripgrep
    workspace: crates
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: RegexMatcher
      path: .
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: crates/pcre2/src/matcher.rs
        - path: crates/searcher/src/lib.rs

  # ─── anyhow (1.0.85) ─────────────────────────────────────────────────────
  - name: tier1_anyhow_read_source
    description: "Read anyhow src/lib.rs (H4.3 full reconstruction)"
    tool: read_file
    read_source_full: true
    action: read
    repo: anyhow
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      code:
        file: sandbox/repos/anyhow/src/lib.rs
        line: 1
        col: 1
        content: "//! [![github]]"

  - name: tier1_anyhow_search_anyhow_macro
    description: "Search 'anyhow!' macro in anyhow src"
    tool: search_content
    action: search
    repo: anyhow
    workspace: .
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: anyhow!
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/error.rs

  # ─── tokio (1.36.0) ──────────────────────────────────────────────────────
  - name: tier1_tokio_read_source
    description: "Read tokio crate src/lib.rs (H4.3 full reconstruction)"
    tool: read_file
    read_source_full: true
    action: read
    repo: tokio
    workspace: tokio
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      code:
        file: sandbox/repos/tokio/tokio/src/lib.rs
        line: 1
        col: 1
        content: "#![allow("

  - name: tier1_tokio_search_tokio_main
    description: "Search 'tokio::main' in tokio crate"
    tool: search_content
    action: search
    repo: tokio
    workspace: tokio
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: tokio::main
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/runtime/mod.rs

  # ─── clap (4.5.4) ────────────────────────────────────────────────────────
  - name: tier1_clap_read_source
    description: "Read clap_builder src/lib.rs (H4.3 full reconstruction)"
    tool: read_file
    read_source_full: true
    action: read
    repo: clap
    workspace: clap_builder
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      path: src/lib.rs
      mode: raw
    ground_truth:
      code:
        file: sandbox/repos/clap/clap_builder/src/lib.rs
        line: 1
        col: 1
        content: "// Copyright"

  - name: tier1_clap_search_arg_action
    description: "Search 'ArgAction' in clap_builder src"
    tool: search_content
    action: search
    repo: clap
    workspace: clap_builder
    scenario_class: read_only
    expected_outcome: pass
    arguments:
      pattern: ArgAction
      path: src
      case_sensitive: true
      max_results: 1000
    ground_truth:
      matches:
        - path: src/lib.rs
        - path: src/builder/command.rs

# Performance budget for CogniCode operations.
# These are MAXIMUM allowed times in microseconds.
#
# ENFORCEMENT: none
#
# This is a declaration, not prose, and perf_budget_checker_contract reads that
# exact line. This file used to say "CI fails if any operation exceeds its
# budget", which was false: no workflow referenced `perf` and nothing invoked
# scripts/perf-budget-check.sh. The checker exists and works, but running it
# takes ~457 s, so wiring it into merge-gate (already 12-20 min) is an open
# decision. Tracked in work item 6e1bb51a-09df-456b-9287-fdfedba835c1.
#
# If you wire the checker into CI, change this line to `ENFORCEMENT: ci` in the
# same commit. The contract fails if the two ever disagree, so the declaration
# cannot rot.
#
# To check manually: ./scripts/perf-budget-check.sh
#   exit 0  every budgeted operation was measured and within budget
#   exit 1  a measured operation exceeded its budget
#   exit 3  a budgeted operation had no benchmark at all
#
# Today 9 of the 16 entries below have no benchmark, so a manual run exits 3.
# That is the honest answer, not a regression.
#
# Measured 2026-10-02 against the real budget, not estimated: 7 entries were
# benchmarked and all 7 are inside their ceiling. The tightest is
# `shortest_path` at 299.171 us against 1000 us (3.3x of headroom); the loosest
# is `subgraph_extraction_50_nodes` at 27.882 us against 2000 us (72x). What
# decides the exit code is the other 9, which have no measurement at all.
#
# Failing the lane on exit 1 alone — a measured regression — while reporting the
# unmeasured entries and continuing, is the honest shape for this checker, and
# it is deliberately not done yet: the 3.3x above is one development machine and
# not a CI runner. Wiring a ceiling whose headroom is unknown on the machine
# that enforces it produces a lane that is red for a reason nobody can act on.
#
# Budgets are generous for CI runners (which are slower than dev machines).

[graph.operations]
# Core graph operations
add_node = 50
add_edge = 50
get_node = 100
get_neighbors = 200
bfs_traversal_100_nodes = 500
shortest_path = 1000
subgraph_extraction_50_nodes = 2000

[mcp.tools]
# MCP tool operations (includes repo round-trip)
graph_nodes_100 = 5000
graph_search = 10000
graph_subgraph = 15000
brain_open = 5000
brain_ask = 30000

[explorerql]
# ExplorerQL parsing and execution
parse_simple = 100
parse_complex = 500
execute_find = 5000
execute_traverse = 10000

[toolchain]
# Pin a la toolchain EXACTA que el repositorio verifica contra.
#
# Las pipelines de PipelineK leen este fichero de la rama de trabajo. Antes lo
# leía `dtolnay/rust-toolchain` desde los workflows de GitHub Actions, y antes
# de eso nada lo fijaba: todas las lanes referenciaban `@stable` sin pin, que
# es tech-debt documentada por QW-05. Sin un workflow que lo lea, este fichero
# pasa a ser la única declaración de la toolchain y a ser lo que la primera
# regla de `rust-toolchain.toml` manda cumplir a cualquier runner.
#
# Subir esta versión requiere DOS pasos:
#   1. actualizar `channel` y `rustfmt`/`clippy` (no requeridos,
#      pero ayudan a CI a saltarse re-install).
#   2. ejecutar el preflight (`release-candidate.pipeline.kts`) sobre la nueva
#      versión ANTES de cortar el tag.
channel = "1.96.0"
components = ["rustfmt", "clippy"]
profile = "minimal"

[workspace]
resolver = "2"
members = [
    "crates/cognicode",
    "crates/cognicode-core",
    "crates/cognicode-mcp",
    "crates/cognicode-cli",
    "crates/cognicode-sandbox",
    "crates/cognicode-graph-algos",
    "crates/cognicode-graph-wasm",
 
    "crates/cognicode-macros",
    # Archived crates — see docs/adr/ADR-001-parked-crates.md (trigger b, 2026-06-25)
    # cognicode-axiom → docs/parked-crates/cognicode-axiom/
    # cognicode-quality → docs/parked-crates/cognicode-quality/
    # cognicode-rule-test-harness → docs/parked-crates/cognicode-rule-test-harness/
    "crates/cognicode-explorer",
    "crates/cognicode-ladybug",
    "crates/cognicode-core-mock",
    "crates/cognicode-runtime",
]
exclude = ["crates/spike-ladybug"]

[workspace.package]
version = "0.101.7"
edition = "2024"
authors = ["CogniCode Team"]
# ADR-011 (CP1.1): license of record, formalising the deferral M0.9 left open.
# Matches every member crate exactly; both operands are in deny.toml's allow list.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal
cognicode-core = { path = "crates/cognicode-core" }
cognicode-graph-algos = { path = "crates/cognicode-graph-algos" }
# cognicode-axiom = { path = "crates/cognicode-axiom" }  # PARKED
cognicode-macros = { path = "crates/cognicode-macros" }

# Distribution (E32-B)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tar = "0.4"
flate2 = "1"

# Parsing
tree-sitter = "0.27"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.26"
tree-sitter-lua = "0.5"
tree-sitter-zig = "1.1"
tree-sitter-dart = "0.2"
tree-sitter-groovy = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.19"
tree-sitter-haskell = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-r = "1.2"
tree-sitter-powershell = "0.26"
tree-sitter-json = "0.24"
tree-sitter-fortran = "0.6"
tree-sitter-verilog = "1.0"
tree-sitter-systemverilog = "0.3"

# Grafos
petgraph = "0.6"

# Async
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "process", "io-util"] }
async-trait = "0.1"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
axum = "0.7"
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# Derives JSON Schema from Rust types so tool output contracts are derived
# from the type that actually produces them instead of hand-written and free
# to drift. Already present in the lockfile as a transitive dependency, so
# declaring it here changes no resolution.
schemars = { version = "1.2", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlparser = "0.53"
bincode = { version = "2.0", features = ["serde"] }
blake3 = "1.5"
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

# Collections
arc-swap = "1.0"
dashmap = "5"
indexmap = "2"
parking_lot = "0.12"

# Filesystem
ignore = "0.4"
walkdir = "2"
tempfile = "3.27"
glob = "0.3"
which = "6"

# Time
chrono = { version = "0.4", features = ["clock"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Regex
regex = "1"

# OpenAPI 3.1 parser — used by cognicode-explorer for cycle e15.5
# (cross-service protocol edge ingestion). Only the JSON support
# (`default-features = false`) is enabled — YAML is not required for
# the OpenAPI ingestion handler since most production specs are
# emitted as JSON by utoipa, tsoa, and NestJS.
oas3 = { version = "0.22", default-features = false }

# Base64
base64 = "0.22"
# Hex encoding (used by edge-emitter for SHA256 spec hashes).
hex = "0.4"

# Constant-time comparison (M3.5 Bearer-token auth middleware).
# `subtle` is a tiny `no_std`-friendly crate that gives us
# `ConstantTimeEq` to compare Bearer tokens without leaking length or
# content timing to attackers. Avoids the well-known foot-gun of
# `if a == b { ok }` for secret comparison.
subtle = "2.6"

# Markdown parser — pulled in by `cognicode-core` (under the
# `multimodal` feature) to drive the `DocsExtractor`. Industry-standard
# event-based parser with zero-copy iteration. Bump the version
# consciously: the 0.10+ releases split off the `Options` builder, so
# any consumer that touches the API must recompile.
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }

# Parallelism
rayon = "1.11.0"

# LSP
lsp-types = "0.93"

# OpenTelemetry
#
# CR-07: 0.27 -> 0.29.1 resolves RUSTSEC-2024-0437 (protobuf 2 stack overflow).
# The target is exact, not a guess, and it is NOT 0.28. Measured against the
# crates.io index on 2026-10-01:
#
#   opentelemetry-prometheus 0.28.0 -> prometheus ^0.13 + protobuf ^2.14  (no fix)
#   opentelemetry-prometheus 0.29.0 -> prometheus ^0.13 + protobuf ^2.14  (no fix)
#   opentelemetry-prometheus 0.29.1 -> prometheus ^0.14, no direct protobuf
#
# `prometheus 0.14.0` is what pulls `protobuf ^3.7.2`, the patched version the
# advisory names. So this is a TWO-major migration, and stopping at 0.29.0
# would produce a tree that looks migrated and is still vulnerable.
# `crates/cognicode-cli/tests/cr07_protobuf_advisory_closed.rs` pins that.
#
# The four crates are NOT version-locked with each other, and the difference
# is load-bearing:
#
#   opentelemetry-prometheus 0.29.0 -> prometheus ^0.13 + protobuf ^2.14  (no fix)
#   opentelemetry-prometheus 0.29.1 -> prometheus ^0.14, no direct protobuf (fix)
#   opentelemetry-otlp          0.29.1 -> DOES NOT EXIST; 0.29.0 is the last of
#                                    the 0.29 line (next release is 0.30.0)
#
# `opentelemetry-otlp` is pinned to 0.29.0 rather than the 0.29.1 the other
# three carry, because it never published a 0.29.1. It can still resolve here
# because it declares `opentelemetry ^0.29` + `opentelemetry_sdk ^0.29`, the
# same line the exporter does, and because it is not where protobuf came from:
# measured from the 0.27 lockfile, `protobuf` was reached only through
# `opentelemetry-prometheus 0.27.0` and `prometheus 0.13.4`, never through otlp.
opentelemetry = "0.29.1"
opentelemetry_sdk = { version = "0.29", features = ["metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.29.0", features = ["metrics", "grpc-tonic"] }
opentelemetry-prometheus = "0.29.1"
# Direct dep so the server binary can build a `prometheus::Registry` and
# call `TextEncoder::encode(&registry.gather(), …)` on `/metrics` (the 0.27
# OTel→Prom exporter removed the old `Prometheus::default().export()`
# shortcut). MUST stay in lockstep with the `prometheus` that
# `opentelemetry-prometheus` resolves, or the two halves of `/metrics` sit on
# different major versions and the collected `MetricFamily`s cannot be encoded.
prometheus = "0.14"

# Mermaid
mermaid-rs-renderer = { version = "0.2", default-features = false }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# MCP
rmcp = { version = "1.7", features = ["server", "transport-io", "client", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-server-session", "which-command"] }
process-wrap = "9.1"

# Rig-core (optional)
rig-core = { version = "0.35", default-features = false, features = ["rustls"] }

# TOML parsing for C4 architecture inference (E6 ADR-039)
toml = "0.8"

# Dev deps
tokio-test = "0.4"
mockall = "0.11"
serial_test = "3.0"

# UUID v4 generation — CSPRNG-based, replaces hand-rolled implementation.
uuid = { version = "1.10", features = ["v4", "serde"] }

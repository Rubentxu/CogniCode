# El aparejo del harness A/B (TASK-93): repos, preguntas, brazos y precio.
#
# Las METAS no están aquí: viven en `slo-budget.toml`, que tiene otro dueño.
# Aquí se declara QUÉ se mide y CÓMO se juzga; allí, cuánto es demasiado.
#
# El harness no es un LLM. Es una política determinista que hace las mismas
# preguntas a las dos superficies con el vocabulario de cada una, para que lo
# que se compara sea la superficie y no un modelo.

[run]
# Llamadas por pregunta tras un calentamiento (el primer arranque indexa y
# se publica aparte como `warmup_ms`). El p95 se calcula sobre estas.
repeats = 3
# En el repo grande cada llamada indexa desde cero: una sola, para no gastar la
# máquina repitiendo lo caro.
large_repeats = 1
# Tiempo máximo de una llamada, en segundos. Una que no vuelve a tiempo queda
# registrada como cortada y la corrida sigue.
call_timeout_s = 120
# Techo de memoria de CADA llamada (cgroup). Lo que lo pasa lo mata el kernel y
# queda registrado como cortado por memoria.
memory_max = "2G"

[price]
# Referencia declarada, no una consulta a ninguna API. Si cambia, se cambia
# aquí y la fecha con ella.
bytes_per_token = 4
usd_per_million_input_tokens = 3.0
as_of = "2026-11-07"

# --- los cuatro repositorios de referencia -----------------------------------

[[repo]]
name = "cognicode"
path = "."
language = "rust"
large = true

[[repo]]
name = "kotlin"
path = "sandbox/fixtures/kotlin"
language = "kotlin"

[[repo]]
name = "jenkins-library"
path = "sandbox/fixtures/groovy-jenkins"
language = "groovy"

[[repo]]
name = "csharp"
path = "sandbox/fixtures/csharp"
language = "csharp"

# --- cómo se reconoce una declaración y una llamada, por lenguaje ------------
#
# `{name}` se sustituye por el nombre escapado. Una declaración que no es una
# llamada es lo que deja al juez del `trace` excluir el fichero que declara.

[language.rust]
declaration = [
  '\b(?:fn|struct|enum|trait|type|const|static|mod|union)\s+{name}\b',
]
call = '\b{name}\s*\('

[language.kotlin]
declaration = [
  '\b(?:class|interface|object|typealias)\s+{name}\b',
  '\bfun\s+(?:<[^>]*>\s*)?(?:[\w.<>?]+\.)?{name}\s*\(',
]
call = '\b{name}\s*\('

# Un paso de una shared library de Jenkins no declara su nombre: lo declara el
# fichero (`vars/<paso>.groovy`) y el `call` de dentro. Los pasos del corpus
# documentan su nombre en la cabecera; esa convención es lo único que el juez
# puede leer sin conocer la ruta, y es una limitación del corpus, no una regla
# general de Groovy.
[language.groovy]
declaration = [
  '\b(?:class|interface|trait|enum)\s+{name}\b',
  '\b(?:def|void|static|String|int|boolean)\s+{name}\s*\(',
  '(?m)^//[^\n]*shared-library step:\s*`{name}\(',
]
call = '\b{name}\s*\('

[language.csharp]
declaration = [
  '\b(?:class|interface|struct|record|enum)\s+{name}\b',
  '\b(?!return\b|new\b|await\b|throw\b|else\b)[\w<>\[\],.?]+\s+{name}\s*(?:<[^>]*>)?\s*\(',
]
call = '\b{name}\s*\('

# --- el juez ------------------------------------------------------------------
#
# Una sola regla por intención, igual para los dos brazos y los cuatro repos.

[judge.intent]
find = "un fichero devuelto declara el símbolo"
inspect = "el nombre esperado está entre los símbolos que el fichero declara"
trace = "un fichero devuelto llama al símbolo"

# --- los dos brazos -----------------------------------------------------------
#
# `profile` es el perfil de superficie del servidor (no el de instalación).
# `{symbol}` y `{file}` se sustituyen por los de la pregunta.

[[arm]]
name = "v2"
profile = "default"

[arm.call.find]
tool = "find"
args = { symbol = "{symbol}" }

[arm.call.inspect]
tool = "inspect"
args = { file = "{file}" }

[arm.call.trace]
tool = "trace"
args = { symbol = "{symbol}", direction = "callers" }

[[arm]]
name = "legacy"
profile = "legacy"

[arm.call.find]
tool = "query_symbol_index"
args = { symbol_name = "{symbol}" }

[arm.call.inspect]
tool = "get_file_symbols"
args = { file_path = "{file}" }

[arm.call.trace]
tool = "get_call_hierarchy"
args = { symbol_name = "{symbol}", direction = "incoming" }

# --- las preguntas ------------------------------------------------------------

[[question]]
repo = "cognicode"
intent = "find"
symbol = "SurfaceProfile"

[[question]]
repo = "cognicode"
intent = "inspect"
file = "crates/cognicode-core/src/interface/surface.rs"
symbol = "SurfaceProfile"

[[question]]
repo = "cognicode"
intent = "trace"
symbol = "memo_key"

[[question]]
repo = "kotlin"
intent = "find"
symbol = "Shape"

[[question]]
repo = "kotlin"
intent = "inspect"
file = "Shapes.kt"
symbol = "Shape"

[[question]]
repo = "kotlin"
intent = "trace"
symbol = "describeShape"

[[question]]
repo = "jenkins-library"
intent = "find"
symbol = "Kube"

[[question]]
repo = "jenkins-library"
intent = "inspect"
file = "src/org/acme/Kube.groovy"
symbol = "Kube"

[[question]]
repo = "jenkins-library"
intent = "trace"
symbol = "apply"

[[question]]
repo = "csharp"
intent = "find"
symbol = "Calculator"

[[question]]
repo = "csharp"
intent = "inspect"
file = "Core/Money.cs"
symbol = "Calculator"

[[question]]
repo = "csharp"
intent = "trace"
symbol = "Shout"

# --- las latencias que no son preguntas ---------------------------------------
#
# Solo el brazo v2 las tiene: `status` y `context` son goals de la superficie
# nueva, y el reindexado de un fichero es el de `reparse_on_edit`, que se mide
# sobre una COPIA del repo (se le añade una línea antes de cada llamada, para
# que haya algo que reindexar) y nunca sobre el árbol del usuario.

[[latency]]
metric = "status"
tool = "status"
args = {}

[[latency]]
metric = "context"
tool = "context"
args = {}

[reparse]
repo = "kotlin"
file = "Shapes.kt"
